node_id: verify.code_quality.gate
flow_id: implementation
kind: gate
title: Code quality result routing
entry: false
terminal: false
assets:
  receipts: []
  artifacts: []
connections:
  in:
  - id: verify.code_quality-to-verify.code_quality.gate
    from: verify.code_quality
    to: verify.code_quality.gate
    'on':
      outcomes:
      - completed
  out:
  - id: verify.code_quality.gate-to-verify.code_review-pass
    from: verify.code_quality.gate
    to: verify.code_review
    'on':
      outcomes:
      - completed
      decisions:
      - pass
  - id: verify.code_quality.gate-to-execute.repair.limit.gate-repair
    from: verify.code_quality.gate
    to: execute.repair.limit.gate
    'on':
      outcomes:
      - completed
      decisions:
      - repair
checks_used:
  on_examine:
  - code-quality-done-or-skipped
  on_open: []
  on_close: []
  on_seal: []
tests: []
authoring: registry:nodes/verify.code_quality.gate/doc.yaml
