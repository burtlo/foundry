node_id: execute.build
flow_id: implementation
kind: step
title: Build graph work items — builders commit via CLI
entry: false
terminal: false
assets:
  receipts:
  - registry:schemas/agent-receipt.schema.json
  artifacts: []
connections:
  in:
  - id: execute.plan-to-execute.build
    from: execute.plan
    to: execute.build
    'on':
      outcomes:
      - completed
  - id: execute.repair.limit.gate-to-execute.build-proceed
    from: execute.repair.limit.gate
    to: execute.build
    'on':
      outcomes:
      - completed
      decisions:
      - proceed
    loop: repair
  out:
  - id: execute.build-to-execute.test
    from: execute.build
    to: execute.test
    'on':
      outcomes:
      - completed
checks_used:
  on_examine:
  - execution-graph-set
  - feature-branch-set
  on_open: []
  on_close: []
  on_seal:
  - validate-build-exit
  - agent-receipt-sealed
tests:
- .cursor/foundry/cli/tests/acceptance/features/execute_plan.feature
- .cursor/foundry/cli/tests/acceptance/features/execute_start_local.feature
- .cursor/foundry/cli/tests/acceptance/features/execute_stub_to_verify_intake.feature
- .cursor/foundry/cli/tests/acceptance/features/run_context.feature
authoring: registry:nodes/execute.build/doc.yaml
