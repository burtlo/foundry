node_id: verify.code_quality
flow_id: implementation
kind: step
title: Automated lint, Bugbot, and security review
entry: false
terminal: false
assets:
  operations: registry:nodes/verify.code_quality/operations.yaml
  receipts:
  - registry:schemas/agent-receipt.schema.json
  artifacts:
  - id: code-quality-report
    kind: document
    uri: run:artifacts/{visit_id}/code-quality-report.md
    media_type: text/markdown
connections:
  in:
  - id: verify.acceptance.gate-to-verify.code_quality-pass
    from: verify.acceptance.gate
    to: verify.code_quality
    'on':
      outcomes:
      - completed
      decisions:
      - pass
  out:
  - id: verify.code_quality-to-verify.code_quality.gate
    from: verify.code_quality
    to: verify.code_quality.gate
    'on':
      outcomes:
      - completed
  - id: verify.code_quality-to-verify.code_review-skipped
    from: verify.code_quality
    to: verify.code_review
    'on':
      outcomes:
      - not_applicable
checks_used:
  on_examine:
  - prior-verify-acceptance-sealed
  - review-enabled
  on_open: []
  on_close: []
  on_seal:
  - agent-receipt-sealed
tests: []
authoring: registry:nodes/verify.code_quality/doc.yaml
