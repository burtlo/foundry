node_id: shape.record.gate
flow_id: implementation
kind: gate
title: Record acceptance criteria
entry: false
terminal: false
assets:
  instructions: registry:nodes/shape.record.gate/instructions.md
  receipts: []
  artifacts: []
connections:
  in:
  - id: shape.record-to-shape.record.gate
    from: shape.record
    to: shape.record.gate
    'on':
      outcomes:
      - completed
  out:
  - id: shape.record.gate-to-execute.start-record
    from: shape.record.gate
    to: execute.start
    'on':
      outcomes:
      - completed
      decisions:
      - accept
  - id: shape.record.gate-to-shape.present-reshape_plan
    from: shape.record.gate
    to: shape.present
    'on':
      outcomes:
      - completed
      decisions:
      - hold
    loop: reshape_plan
checks_used:
  on_examine:
  - prior-shape-record-sealed
  - approved-ac-recorded
  on_open: []
  on_close: []
  on_seal: []
tests:
- .cursor/foundry/cli/tests/acceptance/features/run_context.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_phase_e2e.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_record.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_record_gate.feature
authoring: registry:nodes/shape.record.gate/doc.yaml
