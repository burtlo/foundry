node_id: shape.record
flow_id: implementation
kind: step
title: Shape record — freeze approved_ac and living plan
entry: false
terminal: false
assets:
  instructions: registry:nodes/shape.record/judgment.md
  receipts:
  - registry:schemas/agent-receipt.schema.json
  artifacts:
  - id: plan
    kind: document
    uri: run:artifacts/{visit_id}/plan.md
    media_type: text/markdown
connections:
  in:
  - id: shape.present.gate-to-shape.record-record
    from: shape.present.gate
    to: shape.record
    'on':
      outcomes:
      - completed
      decisions:
      - accept
  out:
  - id: shape.record-to-shape.record.gate
    from: shape.record
    to: shape.record.gate
    'on':
      outcomes:
      - completed
checks_used:
  on_examine:
  - prior-present-sealed
  on_open: []
  on_close: []
  on_seal:
  - approved-ac-recorded
  - agent-receipt-sealed
tests:
- .cursor/foundry/cli/tests/acceptance/features/execute_start_local.feature
- .cursor/foundry/cli/tests/acceptance/features/run_context.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_phase_e2e.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_present_gate.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_record.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_record_gate.feature
authoring: registry:nodes/shape.record/doc.yaml
