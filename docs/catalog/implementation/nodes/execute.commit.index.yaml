node_id: execute.commit
flow_id: implementation
kind: step
title: Final summarizing commit on feature branch
entry: false
terminal: false
assets:
  receipts:
  - registry:schemas/agent-receipt.schema.json
  artifacts:
  - id: final-commit
    kind: reference
    scheme: git_commit
connections:
  in:
  - id: execute.test.gate-to-execute.commit-pass
    from: execute.test.gate
    to: execute.commit
    'on':
      outcomes:
      - completed
      decisions:
      - pass
  out:
  - id: execute.commit-to-execute.commit.gate
    from: execute.commit
    to: execute.commit.gate
    'on':
      outcomes:
      - completed
checks_used:
  on_examine:
  - prior-execute-test-sealed
  on_open: []
  on_close: []
  on_seal:
  - final-commit-recorded
  - agent-receipt-sealed
tests:
- .cursor/foundry/cli/tests/acceptance/features/execute_test_gate.feature
authoring: registry:nodes/execute.commit/doc.yaml
