schema_version: 1
id: python-reference
tags:
  - python
commands:
  build:
    default:
      argv:
        - python
        - verify.py
        - build
      cwd: .
      timeout_seconds: 30
  test:
    default:
      argv:
        - python
        - verify.py
        - test
      cwd: .
      timeout_seconds: 30
verification:
  implementation:
    - build
    - test
  post_repair:
    - build
    - test
builders:
  default_owner: feature-builder
  routes: []
documentation:
  model: feature-records
  config: {}
