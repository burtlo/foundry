profile_version: 1.0.0
team:
  id: foundry-self-host
  display_name: Foundry Self-host

workspace:
  app_folders: ["."]
  default_app_folder: "."
  resolve_templates_from_org: false

intake:
  source: local
  tickets_root: .cursor/foundry/eval/tickets

jira:
  enabled: false
  project_key: FOUNDRY

git:
  feature_branch_pattern: "{developer_first_name}/{issue_key}"
  pr_title_pattern: "{issue_key} - {brief_description}"

org:
  display_name: Foundry
  required_labels: []

story_writer:
  enabled: true
  run_on_jira: false
  run_on_free_text: true
  require_full_ac_presentation: true

templates:
  implement: .cursor/commands/templates/implement-changes-step.md
  add_tests: .cursor/commands/templates/add-tests-step.md
  run_tests: .cursor/commands/templates/run-tests-step.md

foundry:
  default_risk_tier_rules:
    - when: "ac_count < 3"
      tier: high
  grilling:
    enabled: true
    max_rounds: 2
    skip_when_readiness: Ready
  planner:
    required_when_risk: [medium, high]
    min_work_items: 1
  observability:
    emit_receipts: true
    emit_events: true
  knowledge:
    auto_suggest: true
    require_human_promotion: true
  orchestrator:
    strict_mode: true
    thin_context: true
    default_interaction_mode: drive_to_pr
    require_integrity_check: true
