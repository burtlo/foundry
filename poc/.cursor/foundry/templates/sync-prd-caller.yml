name: Sync PRD

# Triggers on PRD changes and calls the org-level reusable workflow.
# All sync logic lives in ORG/factory/.github/workflows/sync-prd.yml
# Replace ORG/factory with the team's factory repository before committing.
#
# Generated by implement.documentation / documentation-workflow when missing.
# Requires org secret O_GH_REPOSITORY_TOKEN on the source repository.
# Callers do not pass Azure secrets.

on:
  push:
    branches: [master, main]
    paths:
      - 'Documentation/prd-*-generated.md'
      - 'docs/prd-*-generated.md'
      - '**/Documentation/prd-*-generated.md'
      - '**/docs/prd-*-generated.md'
  workflow_dispatch:
    # Manual trigger for testing — syncs current PRD files in the repo

# REQUIRED — do not omit. Explicit GITHUB_TOKEN scope for CodeQL and repos with restrictive default permissions.
permissions:
  contents: read

jobs:
  sync:
    uses: ORG/factory/.github/workflows/sync-prd.yml@main
    secrets:
      O_GH_REPOSITORY_TOKEN: ${{ secrets.O_GH_REPOSITORY_TOKEN }}
