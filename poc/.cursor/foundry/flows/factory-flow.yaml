# Foundry v2 flow registry — single source of step order, gates, and skip rules.
#
# Validated by: python .cursor/foundry/cli/foundry.py flow validate
# Diagram:      python .cursor/foundry/cli/foundry.py flow diagram
#
# Expression language used by `when`, `when_skip`, and `requires`:
#   namespaces  config.*  state.*  decision
#   operators   ! && || == != < <= > >= ( )
#   literals    true false null 'text' 123
#   keyword     always  (only valid as a bare `when`)
# Dotted lookups match the longest existing key first, so
# `state.steps.implement.code_review.approved` resolves the literal
# `steps["implement.code_review"]` map.

version: 1
state_schema: schemas/factory-run-state.schema.json

gates:
  approve_refined_story:
    prompt: >-
      Refined story presented in full (sections 1-7 including every acceptance
      criterion). Approve the acceptance criteria, request edits, or ask for
      deeper research. Present on one turn, collect the decision on the next.
    options: [approve, changes, deeper_research]
  approve_deliverables:
    prompt: >-
      Analysis deliverables checklist presented in full. Approve the deliverable
      list or request edits. Present on one turn, collect the decision on the next.
    options: [approve, changes]
  approve_grilling:
    prompt: >-
      Open questions and assumptions from grilling. Answer them, accept the stated
      assumptions, or send the story back for refinement.
    options: [approve, revise_ac, accept_risk]
  approve_ac:
    prompt: >-
      Record the human-approved acceptance criteria. approved_ac must match
      presented_ac verbatim. Approve, request edits, or ask for deeper research.
    options: [approve, changes, deeper_research]
  approve_brief:
    prompt: >-
      Implementation brief (scope, files, approach, test plan) against the approved
      acceptance criteria. Approve, request changes, or send research back.
    options: [approve, changes, revise_research]
  approve_graph:
    prompt: >-
      Execution graph: work items, owners, dependencies, and verification plan.
      Approve before any builder starts, or send the brief back.
    options: [approve, changes, revise_brief]
  approve_implementation:
    prompt: >-
      Code review of the working tree against the brief and acceptance criteria.
      Approve the implementation or request code changes. Nothing is committed yet.
    options: [approve, code_changes]
  approve_devops:
    prompt: >-
      devops-builder pre-PR report: workflow changes and action SHA pins. Approve,
      or request changes. An empty workflow diff is a valid approve.
    options: [approve, changes]
  approve_pre_pr_review:
    prompt: >-
      Bugbot and Security Review findings. Approve as-is, or send findings back to
      the builders to fix.
    options: [approve, fix_findings, workflows_changed, accept_risk]
  approve_documentation:
    prompt: >-
      DocChangeReport: AGENTS.md edits, PRD create/update, and prd-sync result.
      Approve the documentation or request changes.
    options: [approve, doc_changes]
  delivery_check:
    prompt: >-
      Machine gate. `foundry.py delivery-check` must exit 0. No human prompt; the
      parent must not proceed on narrative evidence.
    options: [pass]
  scope_comment:
    prompt: >-
      Out-of-scope Jira comment drafted from pr_extras_register. Post it, edit it,
      or skip it. This is the only Jira comment the factory writes. Present the
      draft on one turn, collect the decision on the next.
    options: [post, edit, skip]
  confirm_pr:
    prompt: >-
      Pull request created. Confirm the PR title and URL, and the Jira transition.
    options: [approve]
  approve_analysis_findings:
    prompt: >-
      Research findings from the deep dive. Approve to draft the report, or request
      deeper research.
    options: [approve, deeper_research]
  approve_analysis_report:
    prompt: >-
      Analysis report draft. Approve or request edits. Draft only — never posted as
      a Jira comment.
    options: [approve, report_edits]
  approve_follow_up_drafts:
    prompt: >-
      Drafted follow-up stories. Approve to create them in Jira, or decline.
    options: [approve, decline]
  confirm_follow_up_created:
    prompt: Confirm the created follow-up issue keys.
    options: [approve]
  approve_confluence_publish:
    prompt: >-
      Confluence page body and target space. Approve publication, retry after a
      failure, or skip Confluence delivery.
    options: [approve, retry, skip]
  confirm_analysis_complete:
    prompt: Confirm the analysis deliverables and the Jira status transition.
    options: [approve]

flows:
  implementation:
    entry: intake.jira
    steps:
      intake.jira:
        title: Jira intake and ticket packet
        unit: steps/intake-jira.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["config.intake.source != 'jira'"]
        inputs: [config.jira, config.atlassian, config.workspace, config.intake]
        state:
          owns:
            - steps.intake.jira.status
            - issue_key
            - app_folder
            - developer_first_name
            - atlassian_source
            - ticket_source
      intake.local:
        title: Local markdown ticket intake
        unit: steps/intake-local.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["config.intake.source != 'local'"]
        inputs: [config.intake, config.workspace, config.story_writer]
        state:
          owns:
            - steps.intake.local.status
            - issue_key
            - app_folder
            - developer_first_name
            - ticket_source
      intake.free_text:
        title: Free-text intake
        unit: steps/intake-free-text.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["config.intake.source != 'chat'"]
        inputs: [config.workspace, config.story_writer, config.intake]
        state:
          owns:
            - steps.intake.free_text.status
            - app_folder
            - developer_first_name
            - ticket_source
      intake.pivot:
        title: Resolve run mode and initialise registers
        unit: steps/intake-pivot.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        inputs: [config.analysis, config.jira]
        state:
          owns:
            - steps.intake.pivot.status
            - run_mode
            - risk_tier
            - risk_tier_source
            - pr_extras_register
      intake.refine:
        title: Story refinement
        unit: steps/intake-refine.md
        subagent: story-writer
        subagent_mode: implementation
        worker_contract: story-writer/implementation
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 4000 }
        handoff_blurb: Draft acceptance criteria ready for grilling or presentation.
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["!config.story_writer.enabled"]
        inputs: [config.story_writer, config.org.required_labels, state.issue_key]
        state:
          owns:
            - steps.intake.refine.status
            - steps.intake.refine.receipt_id
            - readiness
            - clarifying_questions_count
            - draft_ac
      intake.grill:
        title: Grill the story for unknowns
        unit: steps/intake-grill.md
        subagent: grilling
        subagent_mode: intake
        worker_contract: grilling/intake
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 3000 }
        handoff_blurb: Grilling decisions recorded; resolve the gate.
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip:
          - "!config.foundry.grilling.enabled"
          - "!config.story_writer.enabled"
          - "state.readiness == 'Ready' && state.clarifying_questions_count == 0"
        inputs: [state.draft_ac, state.readiness, state.risk_tier, config.foundry.grilling]
        gate:
          kind: human_approval
          prompt_key: approve_grilling
          outcomes: { approve: intake.present_ac, revise_ac: intake.refine, accept_risk: intake.present_ac }
          require:
            - state.steps.intake.grill.human_approved
          blocks: [intake.present_ac]
        state:
          owns:
            - steps.intake.grill.status
            - steps.intake.grill.approved
            - steps.intake.grill.human_approved
            - steps.intake.grill.receipt_id
            - assumptions
            - grilling_decisions
            - grilling_unresolved_count
      intake.present_ac:
        title: Present acceptance criteria
        unit: steps/intake-present-ac.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["!config.story_writer.enabled"]
        inputs: [state.draft_ac, state.readiness, config.story_writer]
        gate:
          kind: two_turn_stop
          prompt_key: approve_refined_story
          outcomes: { approve: intake.approve_ac, changes: intake.refine, deeper_research: intake.refine }
          require:
            - state.steps.intake.present_ac.human_approved
          blocks: [intake.approve_ac, plan.research]
        state:
          owns:
            - steps.intake.present_ac.status
            - steps.intake.present_ac.human_approved
            - steps.intake.present_ac.gate_decision
            - presented_ac
      intake.approve_ac:
        title: Approve acceptance criteria
        unit: steps/intake-approve-ac.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["!config.story_writer.enabled"]
        inputs: [state.presented_ac]
        gate:
          kind: human_confirm
          prompt_key: approve_ac
          outcomes: { approve: plan.research, changes: intake.present_ac, deeper_research: intake.refine }
          require:
            - state.approved_ac_version >= 1
          blocks: [plan.research]
        state:
          owns:
            - steps.intake.approve_ac.status
            - steps.intake.approve_ac.approved
            - steps.intake.approve_ac.gate_decision
            - approved_ac
            - approved_ac_version
      plan.research:
        title: Codebase research
        unit: steps/plan-research.md
        subagent: codebase-researcher
        subagent_mode: implementation
        worker_contract: codebase-researcher/implementation
        receipt_required: true
        context_budget: { max_input_chars: 16000, max_summary_chars: 4000 }
        handoff_blurb: Research receipt complete; prepare the brief.
        run_modes: [implementation]
        delivery_gate: false
        requires:
          - state.steps.intake.approve_ac.approved
          - state.approved_ac_version >= 1
        inputs: [state.approved_ac, state.app_folder]
        state:
          owns:
            - steps.plan.research.status
            - steps.plan.research.receipt_id
      plan.brief:
        title: Implementation brief
        unit: steps/plan-brief.md
        subagent: planner
        subagent_mode: brief
        worker_contract: planner/brief
        receipt_required: true
        context_budget: { max_input_chars: 16000, max_summary_chars: 4000 }
        handoff_blurb: Brief written; resolve approval before graph planning.
        run_modes: [implementation]
        delivery_gate: false
        requires: ["state.steps.plan.research.status == 'completed'"]
        inputs: [state.approved_ac, state.steps.plan.research.receipt_id]
        gate:
          kind: human_approval
          prompt_key: approve_brief
          outcomes: { approve: plan.graph, changes: plan.brief, revise_research: plan.research }
          require:
            - state.steps.plan.brief.human_approved
          blocks: [plan.graph, implement.branch, implement.build]
        state:
          owns:
            - steps.plan.brief.status
            - steps.plan.brief.approved
            - steps.plan.brief.human_approved
            - steps.plan.brief.gate_decision
      plan.graph:
        title: Execution graph
        unit: steps/plan-graph.md
        subagent: planner
        subagent_mode: plan
        worker_contract: planner/plan
        receipt_required: true
        context_budget: { max_input_chars: 16000, max_summary_chars: 4000 }
        handoff_blurb: Execution graph written; validate and resolve approval.
        run_modes: [implementation]
        delivery_gate: false
        requires: [state.steps.plan.brief.human_approved]
        inputs: [state.approved_ac, state.risk_tier]
        actions:
          on_enter: [ensure_execution_graph_reference]
        gate:
          kind: human_approval
          prompt_key: approve_graph
          outcomes: { approve: implement.branch, changes: plan.graph, revise_brief: plan.brief }
          require:
            - state.steps.plan.graph.human_approved
          blocks: [implement.branch, implement.build]
        state:
          owns:
            - steps.plan.graph.status
            - steps.plan.graph.approved
            - steps.plan.graph.human_approved
            - execution_graph_id
      implement.branch:
        title: Create the feature branch
        unit: steps/implement-branch.md
        subagent: null
        run_modes: [implementation]
        delivery_gate: false
        requires:
          - state.steps.plan.brief.human_approved
          - state.steps.plan.graph.human_approved
        inputs: [config.git, state.issue_key, state.developer_first_name]
        state:
          owns:
            - steps.implement.branch.status
            - default_branch
            - feature_branch
            - feature_branch_head
      implement.build:
        title: Build and test
        unit: steps/implement-build.md
        subagent: null
        subagent_mode: null
        context_budget: { max_input_chars: 20000, max_summary_chars: 4000 }
        run_modes: [implementation]
        delivery_gate: false
        requires: [state.feature_branch]
        inputs: [config.templates, state.execution_graph_id, state.approved_ac]
        actions:
          on_exit: [validate_build_exit]
        state:
          owns:
            - steps.implement.build.status
            - steps.implement.build.receipt_id
      implement.validate:
        title: Validate implementation against the brief
        unit: steps/implement-validate.md
        subagent: implementation-validator
        subagent_mode: validate
        worker_contract: implementation-validator/validate
        receipt_required: true
        context_budget: { max_input_chars: 16000, max_summary_chars: 4000 }
        handoff_blurb: Implementation validation complete; route findings.
        run_modes: [implementation]
        delivery_gate: false
        requires: ["state.steps.implement.build.status == 'completed'"]
        inputs: [state.approved_ac, state.execution_graph_id]
        state:
          owns:
            - steps.implement.validate.status
            - steps.implement.validate.receipt_id
      implement.code_review:
        title: Human code review
        unit: steps/implement-code-review.md
        subagent: null
        run_modes: [implementation]
        delivery_gate: false
        requires: ["state.steps.implement.validate.status == 'completed'"]
        inputs: [state.approved_ac, config.templates.code_review]
        gate:
          kind: human_approval
          prompt_key: approve_implementation
          outcomes: { approve: "$forward", code_changes: implement.build }
          require:
            - state.steps.implement.code_review.human_approved
          blocks:
            - implement.devops_review
            - implement.pre_pr_review
            - implement.documentation
            - deliver.gate
            - deliver.scope_comment
            - deliver.ship
        state:
          owns:
            - steps.implement.code_review.status
            - steps.implement.code_review.approved
            - steps.implement.code_review.human_approved
            - steps.implement.code_review.gate_decision
      implement.devops_review:
        title: devops-builder pre-PR workflow review
        unit: steps/implement-devops-review.md
        subagent: devops-builder
        subagent_mode: pre_pr_review
        worker_contract: devops-builder/pre_pr_review
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 4000 }
        handoff_blurb: DevOps review complete; resolve the approval gate.
        run_modes: [implementation]
        delivery_gate: true
        when_skip: ["!(config.devops.enabled && config.devops.run_before_pr)"]
        requires: [state.steps.implement.code_review.human_approved]
        inputs: [config.devops, config.org.display_name]
        gate:
          kind: human_approval
          prompt_key: approve_devops
          outcomes: { approve: "$forward", changes: implement.devops_review }
          require:
            - state.steps.implement.devops_review.human_approved
          blocks: [implement.documentation, deliver.gate, deliver.ship]
        state:
          owns:
            - steps.implement.devops_review.status
            - steps.implement.devops_review.report
            - steps.implement.devops_review.approved
            - steps.implement.devops_review.human_approved
      implement.pre_pr_review:
        title: Pre-PR Bugbot and Security review
        unit: steps/implement-pre-pr-review.md
        subagent: null
        run_modes: [implementation]
        delivery_gate: true
        when_skip: ["!(config.review.enabled && config.review.run_before_pr)"]
        requires: [state.steps.implement.code_review.human_approved]
        inputs: [config.review, state.feature_branch]
        gate:
          kind: human_approval
          prompt_key: approve_pre_pr_review
          outcomes:
            approve: implement.documentation
            fix_findings: implement.build
            workflows_changed: implement.devops_review
            accept_risk: implement.documentation
          require:
            - state.steps.implement.pre_pr_review.human_approved
          blocks: [implement.documentation, deliver.gate, deliver.ship]
        state:
          owns:
            - steps.implement.pre_pr_review.status
            - steps.implement.pre_pr_review.report
            - steps.implement.pre_pr_review.approved
            - steps.implement.pre_pr_review.human_approved
      implement.documentation:
        title: Documentation workflow and PRD
        unit: steps/implement-documentation.md
        subagent: documentation-writer
        subagent_mode: implementation
        worker_contract: documentation-writer/implementation
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 4000 }
        handoff_blurb: Documentation receipt complete; resolve approval.
        run_modes: [implementation]
        delivery_gate: true
        requires:
          - state.steps.implement.code_review.human_approved
          - "!config.review.enabled || !config.review.run_before_pr || state.steps.implement.pre_pr_review.human_approved"
        inputs: [config.templates.documentation_workflow, config.templates.sync_prd_caller]
        gate:
          kind: human_approval
          prompt_key: approve_documentation
          outcomes: { approve: deliver.gate, doc_changes: implement.documentation }
          require:
            - state.steps.implement.documentation.human_approved
            - "state.steps.implement.documentation.report == 'received'"
          blocks: [deliver.gate, deliver.scope_comment, deliver.ship]
        state:
          owns:
            - steps.implement.documentation.status
            - steps.implement.documentation.report
            - steps.implement.documentation.human_approved
            - steps.implement.documentation.prd_created_or_updated
            - steps.implement.documentation.sync_prd_ok
            - pr_extras_register
      deliver.gate:
        title: Pre-delivery evidence gate
        unit: steps/deliver-gate.md
        subagent: null
        run_modes: [implementation]
        delivery_gate: true
        requires: [state.steps.implement.documentation.human_approved]
        inputs: [state.steps, config.devops, config.review]
        gate:
          kind: evidence_only
          prompt_key: delivery_check
          blocks: [deliver.scope_comment, deliver.ship]
        state:
          owns:
            - steps.deliver.gate.status
            - steps.deliver.gate.notes
      deliver.scope_comment:
        title: Out-of-scope Jira comment
        unit: steps/deliver-scope-comment.md
        subagent: null
        run_modes: [implementation]
        delivery_gate: false
        require_delivery_check: true
        requires: ["state.steps.deliver.gate.status == 'completed'"]
        when_skip: ["state.ticket_source != 'jira'"]
        inputs: [state.pr_extras_register, state.issue_key, state.ticket_source]
        gate:
          kind: human_confirm
          prompt_key: scope_comment
          outcomes: { post: deliver.ship, edit: deliver.ship, skip: deliver.ship }
          blocks: [deliver.ship]
        state:
          owns:
            - steps.deliver.scope_comment.status
            - steps.deliver.scope_comment.gate_decision
      deliver.ship:
        title: Commit, push, PR, and Jira transition
        unit: steps/deliver-ship.md
        subagent: null
        run_modes: [implementation]
        delivery_gate: false
        require_delivery_check: true
        requires:
          - "state.ticket_source != 'jira' || state.steps.deliver.scope_comment.status == 'completed'"
        inputs: [config.git, config.jira_transitions, state.feature_branch]
        gate:
          kind: human_confirm
          prompt_key: confirm_pr
          outcomes: { approve: { terminal: true } }
        state:
          owns:
            - steps.deliver.ship.status
            - steps.deliver.ship.gate_decision
            - resolved_pr_title
            - pr_url
    edges:
      - { from: intake.jira, to: intake.local, when: "config.intake.source == 'local'", priority: 30 }
      - { from: intake.jira, to: intake.free_text, when: "config.intake.source == 'chat'", priority: 20 }
      - { from: intake.jira, to: intake.pivot, when: "config.intake.source == 'jira'", priority: 10 }
      - { from: intake.local, to: intake.pivot, priority: 10 }
      - { from: intake.free_text, to: intake.pivot, priority: 10 }
      - { from: intake.pivot, to: intake.refine, priority: 10 }
      - { from: intake.refine, to: intake.grill, priority: 10 }
      - { from: intake.grill, to: intake.refine, when: "decision == 'revise_ac'", priority: 20, rework: true }
      - { from: intake.grill, to: intake.present_ac, when: "decision == 'approve'", priority: 15 }
      - { from: intake.grill, to: intake.present_ac, when: "decision == 'accept_risk'", priority: 10 }
      - { from: intake.grill, to: intake.present_ac, priority: 1 }
      - { from: intake.present_ac, to: intake.approve_ac, when: "decision == 'approve'", priority: 20 }
      - { from: intake.present_ac, to: intake.refine, when: "decision == 'changes'", priority: 15, rework: true }
      - { from: intake.present_ac, to: intake.refine, when: "decision == 'deeper_research'", priority: 10, rework: true }
      - { from: intake.approve_ac, to: plan.research, when: "decision == 'approve'", priority: 20 }
      - { from: intake.approve_ac, to: intake.present_ac, when: "decision == 'changes'", priority: 15, rework: true }
      - { from: intake.approve_ac, to: intake.refine, when: "decision == 'deeper_research'", priority: 10, rework: true }
      - { from: plan.research, to: plan.brief, priority: 10 }
      - { from: plan.brief, to: plan.research, when: "decision == 'revise_research'", priority: 20, rework: true }
      - { from: plan.brief, to: plan.brief, when: "decision == 'changes'", priority: 15, rework: true }
      - { from: plan.brief, to: plan.graph, when: "decision == 'approve'", priority: 10 }
      - { from: plan.graph, to: plan.brief, when: "decision == 'revise_brief'", priority: 20, rework: true }
      - { from: plan.graph, to: plan.graph, when: "decision == 'changes'", priority: 15, rework: true }
      - { from: plan.graph, to: implement.branch, when: "decision == 'approve'", priority: 10 }
      - { from: implement.branch, to: implement.build, priority: 10 }
      - { from: implement.build, to: implement.validate, priority: 10 }
      - { from: implement.validate, to: implement.build, when: "decision == 'critical_findings'", priority: 20, rework: true }
      - { from: implement.validate, to: implement.code_review, when: "decision != 'critical_findings'", priority: 10 }
      - { from: implement.code_review, to: implement.build, when: "decision == 'code_changes'", priority: 40, rework: true }
      - { from: implement.code_review, to: implement.devops_review, when: "decision == 'approve' && config.devops.enabled && config.devops.run_before_pr", priority: 30 }
      - { from: implement.code_review, to: implement.pre_pr_review, when: "decision == 'approve' && !(config.devops.enabled && config.devops.run_before_pr) && config.review.enabled && config.review.run_before_pr", priority: 20 }
      - { from: implement.code_review, to: implement.documentation, when: "decision == 'approve' && !(config.devops.enabled && config.devops.run_before_pr) && !(config.review.enabled && config.review.run_before_pr)", priority: 10 }
      - { from: implement.devops_review, to: implement.devops_review, when: "decision == 'changes'", priority: 30, rework: true }
      - { from: implement.devops_review, to: implement.pre_pr_review, when: "decision == 'approve' && config.review.enabled && config.review.run_before_pr", priority: 20 }
      - { from: implement.devops_review, to: implement.documentation, when: "decision == 'approve' && !(config.review.enabled && config.review.run_before_pr)", priority: 10 }
      - { from: implement.pre_pr_review, to: implement.build, when: "decision == 'fix_findings'", priority: 30, rework: true }
      - { from: implement.pre_pr_review, to: implement.devops_review, when: "decision == 'workflows_changed'", priority: 20, rework: true }
      - { from: implement.pre_pr_review, to: implement.documentation, when: "decision == 'approve'", priority: 15 }
      - { from: implement.pre_pr_review, to: implement.documentation, when: "decision == 'accept_risk'", priority: 10 }
      - { from: implement.documentation, to: implement.documentation, when: "decision == 'doc_changes'", priority: 20, rework: true }
      - { from: implement.documentation, to: deliver.gate, when: "decision == 'approve'", priority: 10 }
      - { from: deliver.gate, to: deliver.ship, when: "state.ticket_source != 'jira'", priority: 20 }
      - { from: deliver.gate, to: deliver.scope_comment, priority: 10 }
      - { from: deliver.scope_comment, to: deliver.ship, when: "decision == 'post'", priority: 30 }
      - { from: deliver.scope_comment, to: deliver.ship, when: "decision == 'edit'", priority: 20 }
      - { from: deliver.scope_comment, to: deliver.ship, when: "decision == 'skip'", priority: 10 }

  analysis:
    entry: intake.jira
    steps:
      intake.jira:
        title: Jira intake and ticket packet
        unit: steps/intake-jira.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["config.intake.source != 'jira'"]
        inputs: [config.jira, config.atlassian, config.workspace, config.intake]
        state:
          owns:
            - steps.intake.jira.status
            - issue_key
            - app_folder
            - developer_first_name
            - atlassian_source
            - ticket_source
      intake.local:
        title: Local markdown ticket intake
        unit: steps/intake-local.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["config.intake.source != 'local'"]
        inputs: [config.intake, config.workspace, config.story_writer]
        state:
          owns:
            - steps.intake.local.status
            - issue_key
            - app_folder
            - developer_first_name
            - ticket_source
      intake.free_text:
        title: Free-text intake
        unit: steps/intake-free-text.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["config.intake.source != 'chat'"]
        inputs: [config.workspace, config.story_writer, config.intake]
        state:
          owns:
            - steps.intake.free_text.status
            - app_folder
            - developer_first_name
            - ticket_source
      intake.pivot:
        title: Resolve run mode and initialise registers
        unit: steps/intake-pivot.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        inputs: [config.analysis, config.jira]
        state:
          owns:
            - steps.intake.pivot.status
            - run_mode
            - risk_tier
            - risk_tier_source
            - pr_extras_register
      intake.refine:
        title: Analysis deliverables refinement
        unit: steps/intake-refine.md
        subagent: story-writer
        subagent_mode: analysis_deliverables
        worker_contract: story-writer/analysis_deliverables
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 4000 }
        handoff_blurb: Analysis deliverables ready for grilling or presentation.
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["!config.story_writer.enabled"]
        inputs: [config.story_writer, config.analysis, state.issue_key]
        state:
          owns:
            - steps.intake.refine.status
            - steps.intake.refine.receipt_id
            - readiness
            - clarifying_questions_count
            - draft_ac
      intake.grill:
        title: Grill the analysis scope for unknowns
        unit: steps/intake-grill.md
        subagent: grilling
        subagent_mode: intake
        worker_contract: grilling/intake
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 3000 }
        handoff_blurb: Analysis grilling decisions recorded; resolve the gate.
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip:
          - "!config.foundry.grilling.enabled"
          - "!config.story_writer.enabled"
          - "state.readiness == 'Ready' && state.clarifying_questions_count == 0"
        inputs: [state.draft_ac, state.readiness, state.risk_tier, config.foundry.grilling]
        gate:
          kind: human_approval
          prompt_key: approve_grilling
          outcomes: { approve: intake.present_ac, revise_ac: intake.refine, accept_risk: intake.present_ac }
          require:
            - state.steps.intake.grill.human_approved
          blocks: [intake.present_ac]
        state:
          owns:
            - steps.intake.grill.status
            - steps.intake.grill.approved
            - steps.intake.grill.human_approved
            - steps.intake.grill.receipt_id
            - assumptions
            - grilling_decisions
            - grilling_unresolved_count
      intake.present_ac:
        title: Present deliverable checklist
        unit: steps/intake-present-ac.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["!config.story_writer.enabled"]
        inputs: [state.draft_ac, state.readiness, config.story_writer, config.analysis]
        gate:
          kind: two_turn_stop
          prompt_key: approve_deliverables
          outcomes: { approve: intake.approve_ac, changes: intake.refine }
          require:
            - state.steps.intake.present_ac.human_approved
          blocks: [intake.approve_ac, analysis.research]
        state:
          owns:
            - steps.intake.present_ac.status
            - steps.intake.present_ac.human_approved
            - steps.intake.present_ac.gate_decision
            - presented_ac
      intake.approve_ac:
        title: Approve deliverable checklist
        unit: steps/intake-approve-ac.md
        subagent: null
        run_modes: [implementation, analysis]
        delivery_gate: false
        when_skip: ["!config.story_writer.enabled"]
        inputs: [state.presented_ac]
        gate:
          kind: human_confirm
          prompt_key: approve_ac
          outcomes: { approve: analysis.research, changes: intake.present_ac, deeper_research: intake.refine }
          require:
            - state.approved_ac_version >= 1
          blocks: [analysis.research]
        state:
          owns:
            - steps.intake.approve_ac.status
            - steps.intake.approve_ac.approved
            - steps.intake.approve_ac.gate_decision
            - approved_ac
            - approved_ac_version
      analysis.research:
        title: Deep-dive investigation
        unit: steps/analysis-research.md
        subagent: codebase-researcher
        subagent_mode: analysis
        worker_contract: codebase-researcher/analysis
        receipt_required: true
        context_budget: { max_input_chars: 16000, max_summary_chars: 4000 }
        handoff_blurb: Analysis research complete; resolve findings approval.
        run_modes: [analysis]
        delivery_gate: false
        requires:
          - state.steps.intake.approve_ac.approved
          - state.approved_ac_version >= 1
        inputs: [state.approved_ac, state.app_folder]
        gate:
          kind: human_approval
          prompt_key: approve_analysis_findings
          outcomes: { approve: analysis.report, deeper_research: analysis.research }
          require:
            - state.steps.analysis.research.human_approved
          blocks: [analysis.report]
        state:
          owns:
            - steps.analysis.research.status
            - steps.analysis.research.approved
            - steps.analysis.research.human_approved
            - steps.analysis.research.receipt_id
            - steps.analysis.research.follow_up_needed
      analysis.report:
        title: Analysis report draft
        unit: steps/analysis-report.md
        subagent: documentation-writer
        subagent_mode: analysis
        worker_contract: documentation-writer/analysis
        receipt_required: true
        context_budget: { max_input_chars: 16000, max_summary_chars: 4000 }
        handoff_blurb: Analysis report drafted; resolve report approval.
        run_modes: [analysis]
        delivery_gate: false
        requires: [state.steps.analysis.research.human_approved]
        inputs: [state.steps.analysis.research.receipt_id, state.approved_ac]
        gate:
          kind: human_approval
          prompt_key: approve_analysis_report
          outcomes: { approve: "$forward", report_edits: analysis.report }
          require:
            - state.steps.analysis.report.human_approved
          blocks: [analysis.follow_up_draft, analysis.confluence, analysis.deliver]
        state:
          owns:
            - steps.analysis.report.status
            - steps.analysis.report.approved
            - steps.analysis.report.human_approved
      analysis.follow_up_draft:
        title: Draft follow-up stories
        unit: steps/analysis-follow-up-draft.md
        subagent: story-writer
        subagent_mode: follow_up_stories
        worker_contract: story-writer/follow_up_stories
        receipt_required: true
        context_budget: { max_input_chars: 12000, max_summary_chars: 4000 }
        handoff_blurb: Follow-up story drafts ready for approval.
        run_modes: [analysis]
        delivery_gate: false
        when_skip: ["!config.analysis.follow_up_stories.enabled"]
        requires: [state.steps.analysis.report.human_approved]
        inputs: [state.steps.analysis.research.receipt_id, config.jira.project_key]
        gate:
          kind: human_approval
          prompt_key: approve_follow_up_drafts
          outcomes: { approve: analysis.follow_up_create, decline: "$forward" }
          require:
            - state.steps.analysis.follow_up_draft.human_approved
          blocks: [analysis.follow_up_create]
        state:
          owns:
            - steps.analysis.follow_up_draft.status
            - steps.analysis.follow_up_draft.approved
            - steps.analysis.follow_up_draft.human_approved
            - steps.analysis.follow_up_draft.gate_decision
      analysis.follow_up_create:
        title: Create follow-up Jira issues
        unit: steps/analysis-follow-up-create.md
        subagent: null
        run_modes: [analysis]
        delivery_gate: false
        requires: [state.steps.analysis.follow_up_draft.human_approved]
        inputs: [config.jira, config.org.required_labels]
        gate:
          kind: human_confirm
          prompt_key: confirm_follow_up_created
          outcomes: { approve: "$forward" }
        state:
          owns:
            - steps.analysis.follow_up_create.status
            - steps.analysis.follow_up_create.created_issue_keys
      analysis.confluence:
        title: Publish the report to Confluence
        unit: steps/analysis-confluence.md
        subagent: null
        run_modes: [analysis]
        delivery_gate: false
        when_skip: ["!config.analysis.confluence.enabled"]
        requires: [state.steps.analysis.report.human_approved]
        inputs: [config.analysis.confluence, state.steps.analysis.report.status]
        gate:
          kind: human_approval
          prompt_key: approve_confluence_publish
          outcomes: { approve: analysis.deliver, retry: analysis.confluence, skip: analysis.deliver }
          require:
            - state.steps.analysis.confluence.human_approved
          blocks: [analysis.deliver]
        state:
          owns:
            - steps.analysis.confluence.status
            - steps.analysis.confluence.approved
            - steps.analysis.confluence.human_approved
            - steps.analysis.confluence.page_url
      analysis.deliver:
        title: Deliver analysis and transition the ticket
        unit: steps/analysis-deliver.md
        subagent: null
        run_modes: [analysis]
        delivery_gate: false
        requires: [state.steps.analysis.report.human_approved]
        inputs: [config.jira_transitions, state.issue_key]
        gate:
          kind: human_confirm
          prompt_key: confirm_analysis_complete
          outcomes: { approve: { terminal: true } }
        state:
          owns:
            - steps.analysis.deliver.status
            - steps.analysis.deliver.gate_decision
    edges:
      - { from: intake.jira, to: intake.local, when: "config.intake.source == 'local'", priority: 30 }
      - { from: intake.jira, to: intake.free_text, when: "config.intake.source == 'chat'", priority: 20 }
      - { from: intake.jira, to: intake.pivot, when: "config.intake.source == 'jira'", priority: 10 }
      - { from: intake.local, to: intake.pivot, priority: 10 }
      - { from: intake.free_text, to: intake.pivot, priority: 10 }
      - { from: intake.pivot, to: intake.refine, priority: 10 }
      - { from: intake.refine, to: intake.grill, priority: 10 }
      - { from: intake.grill, to: intake.refine, when: "decision == 'revise_ac'", priority: 20, rework: true }
      - { from: intake.grill, to: intake.present_ac, when: "decision == 'approve'", priority: 15 }
      - { from: intake.grill, to: intake.present_ac, when: "decision == 'accept_risk'", priority: 10 }
      - { from: intake.grill, to: intake.present_ac, priority: 1 }
      - { from: intake.present_ac, to: intake.approve_ac, when: "decision == 'approve'", priority: 20 }
      - { from: intake.present_ac, to: intake.refine, when: "decision == 'changes'", priority: 10, rework: true }
      - { from: intake.approve_ac, to: analysis.research, when: "decision == 'approve'", priority: 20 }
      - { from: intake.approve_ac, to: intake.present_ac, when: "decision == 'changes'", priority: 15, rework: true }
      - { from: intake.approve_ac, to: intake.refine, when: "decision == 'deeper_research'", priority: 10, rework: true }
      - { from: analysis.research, to: analysis.research, when: "decision == 'deeper_research'", priority: 20, rework: true }
      - { from: analysis.research, to: analysis.report, when: "decision == 'approve'", priority: 10 }
      - { from: analysis.report, to: analysis.report, when: "decision == 'report_edits'", priority: 40, rework: true }
      - { from: analysis.report, to: analysis.follow_up_draft, when: "decision == 'approve' && config.analysis.follow_up_stories.enabled && state.steps.analysis.research.follow_up_needed", priority: 30 }
      - { from: analysis.report, to: analysis.confluence, when: "decision == 'approve' && config.analysis.confluence.enabled", priority: 20 }
      - { from: analysis.report, to: analysis.deliver, when: "decision == 'approve'", priority: 10 }
      - { from: analysis.follow_up_draft, to: analysis.follow_up_create, when: "decision == 'approve'", priority: 30 }
      - { from: analysis.follow_up_draft, to: analysis.confluence, when: "decision == 'decline' && config.analysis.confluence.enabled", priority: 20 }
      - { from: analysis.follow_up_draft, to: analysis.deliver, when: "decision == 'decline'", priority: 10 }
      - { from: analysis.follow_up_create, to: analysis.confluence, when: "decision == 'approve' && config.analysis.confluence.enabled", priority: 20 }
      - { from: analysis.follow_up_create, to: analysis.deliver, when: "decision == 'approve' && !config.analysis.confluence.enabled", priority: 10 }
      - { from: analysis.confluence, to: analysis.confluence, when: "decision == 'retry'", priority: 30, rework: true }
      - { from: analysis.confluence, to: analysis.deliver, when: "decision == 'approve'", priority: 20 }
      - { from: analysis.confluence, to: analysis.deliver, when: "decision == 'skip'", priority: 10 }
