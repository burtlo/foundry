cases:
  - name: full-default-command-manifest
    manifest:
      schema_version: 1
      id: porcelain
      tags: [go, chimera]
      commands:
        build:
          default:
            argv: [make, build]
            cwd: .
            timeout_seconds: 900
        test:
          default:
            argv: [make, test]
            cwd: .
            timeout_seconds: 1200
        precommit:
          default:
            argv: [make, precommit]
            cwd: .
            timeout_seconds: 1800
      verification:
        implementation: [build, test]
        post_repair: [build, test, precommit]
      builders:
        default_owner: feature-builder
        routes:
          - id: client
            owner: client-builder
            priority: 200
            globs: ["**/adminui/embed/**", "**/*.js"]
          - id: backend
            owner: backend-builder
            priority: 100
            globs: ["chimera/**", "internal/**", "migrations/**"]
      documentation:
        model: feature-records
        config:
          include: ["docs/features/**"]
          exclude: ["docs/plans/**", "docs/version-v0.*", ".cursor/skills/**"]

  - name: platform-specific-commands
    manifest:
      schema_version: 1
      id: cross-platform-app
      commands:
        test:
          windows:
            argv: [powershell, -NoProfile, -File, scripts/test.ps1]
            cwd: .
            timeout_seconds: 600
          posix:
            argv: [bash, scripts/test.sh]
            cwd: .
            timeout_seconds: 600
      verification:
        implementation: [test]
        post_repair: [test]
      builders:
        default_owner: feature-builder
        routes: []
      documentation:
        model: iot-agents-prd
        config: {}

  - name: analysis-capable-minimum
    manifest:
      schema_version: 1
      id: analysis-only
      commands: {}
      verification:
        implementation: []
        post_repair: []
      builders: {}
      documentation:
        model: feature-records
        config: {}
