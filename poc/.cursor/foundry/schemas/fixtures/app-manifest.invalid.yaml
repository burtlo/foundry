cases:
  - name: unsupported-schema-version
    expected_path: schema_version
    manifest:
      schema_version: 2
      id: sample-app
      commands: {}
      verification: {implementation: [], post_repair: []}
      builders: {}
      documentation: {model: feature-records, config: {}}

  - name: invalid-identity
    expected_path: id
    manifest:
      schema_version: 1
      id: Sample_App
      commands: {}
      verification: {implementation: [], post_repair: []}
      builders: {}
      documentation: {model: feature-records, config: {}}

  - name: shell-command-string
    expected_path: commands.build
    manifest:
      schema_version: 1
      id: sample-app
      commands:
        build: make build
      verification: {implementation: [build], post_repair: [build]}
      builders: {default_owner: feature-builder, routes: []}
      documentation: {model: feature-records, config: {}}

  - name: parent-cwd-traversal
    expected_path: commands.build.default.cwd
    manifest:
      schema_version: 1
      id: sample-app
      commands:
        build:
          default:
            argv: [make, build]
            cwd: ../other-app
            timeout_seconds: 900
      verification: {implementation: [build], post_repair: [build]}
      builders: {default_owner: feature-builder, routes: []}
      documentation: {model: feature-records, config: {}}

  - name: absolute-windows-cwd
    expected_path: commands.build.default.cwd
    manifest:
      schema_version: 1
      id: sample-app
      commands:
        build:
          default:
            argv: [make, build]
            cwd: C:\source\sample-app
            timeout_seconds: 900
      verification: {implementation: [build], post_repair: [build]}
      builders: {default_owner: feature-builder, routes: []}
      documentation: {model: feature-records, config: {}}

  - name: missing-command-timeout
    expected_path: commands.test.default
    manifest:
      schema_version: 1
      id: sample-app
      commands:
        test:
          default:
            argv: [make, test]
            cwd: .
      verification: {implementation: [test], post_repair: [test]}
      builders: {default_owner: feature-builder, routes: []}
      documentation: {model: feature-records, config: {}}

  - name: timeout-above-v1-limit
    expected_path: commands.test.default.timeout_seconds
    manifest:
      schema_version: 1
      id: sample-app
      commands:
        test:
          default:
            argv: [make, test]
            cwd: .
            timeout_seconds: 86401
      verification: {implementation: [test], post_repair: [test]}
      builders: {default_owner: feature-builder, routes: []}
      documentation: {model: feature-records, config: {}}

  - name: empty-platform-command
    expected_path: commands.test
    manifest:
      schema_version: 1
      id: sample-app
      commands:
        test: {}
      verification: {implementation: [test], post_repair: [test]}
      builders: {default_owner: feature-builder, routes: []}
      documentation: {model: feature-records, config: {}}

  - name: documentation-config-is-not-an-object
    expected_path: documentation.config
    manifest:
      schema_version: 1
      id: sample-app
      commands: {}
      verification: {implementation: [], post_repair: []}
      builders: {}
      documentation:
        model: feature-records
        config: []

  - name: unknown-root-property
    expected_path: root
    manifest:
      schema_version: 1
      id: sample-app
      projectType: go
      commands: {}
      verification: {implementation: [], post_repair: []}
      builders: {}
      documentation: {model: feature-records, config: {}}
