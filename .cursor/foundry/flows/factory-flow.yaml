# Craft implementation flow — workflow schema v1 (registry format version 2)
#
# Spec:     docs/v1-spec.md
# Validate: JSON Schema factory-flow.schema.json plus semantic graph validation
#
# Artifact declarations are node-local. Receipts are evidence, not work artifacts.
# Connections are the only routing definition.

version: 2
state_schema: registry:schemas/factory-run-state.schema.json
expression:
  namespaces:
  - config
  - state
  - visit
  - history
  operators:
  - '!'
  - '&&'
  - '||'
  - ==
  - '!='
  - <
  - <=
  - '>'
  - '>='
  - in
  - (
  - )
flow:
  id: implementation
  entry: shape.intake
  checks:
    validate-manifest:
      command: validate_manifest
    validate-git-clean-execute:
      command: validate_git_clean_execute
    validate-verify-context:
      command: validate_verify_context
    ensure-execution-graph-reference:
      command: ensure_execution_graph_reference
    validate-build-exit:
      command: validate_build_exit
    prior-shape-intake-sealed:
      when: history.last('visit.sealed', node_id='shape.intake') != null && history.last('visit.sealed',
        node_id='shape.intake').outcome == 'completed'
    prior-examine-sealed:
      when: history.last('visit.sealed', node_id='shape.examine') != null && history.last('visit.sealed',
        node_id='shape.examine').outcome == 'completed'
    prior-present-sealed:
      when: history.last('visit.sealed', node_id='shape.present') != null && history.last('visit.sealed',
        node_id='shape.present').outcome == 'completed'
    prior-shape-record-sealed:
      when: history.last('visit.sealed', node_id='shape.record') != null && history.last('visit.sealed',
        node_id='shape.record').outcome == 'completed'
    prior-execute-intake-sealed:
      when: history.last('visit.sealed', node_id='execute.intake') != null && history.last('visit.sealed',
        node_id='execute.intake').outcome == 'completed'
    prior-execute-commit-sealed:
      when: history.last('visit.sealed', node_id='execute.commit') != null && history.last('visit.sealed',
        node_id='execute.commit').outcome == 'completed'
    prior-verify-intake-sealed:
      when: history.last('visit.sealed', node_id='verify.intake') != null && history.last('visit.sealed',
        node_id='verify.intake').outcome == 'completed'
    prior-verify-acceptance-sealed:
      when: history.last('visit.sealed', node_id='verify.acceptance') != null && history.last('visit.sealed',
        node_id='verify.acceptance').outcome == 'completed'
    prior-execute-build-sealed:
      when: history.last('visit.sealed', node_id='execute.build') != null && history.last('visit.sealed',
        node_id='execute.build').outcome == 'completed'
    prior-execute-test-sealed:
      when: history.last('visit.sealed', node_id='execute.test') != null && history.last('visit.sealed',
        node_id='execute.test').outcome == 'completed'
    approved-ac-recorded:
      when: state.approved_ac_version >= 1
    feature-branch-set:
      when: state.feature_branch != null
    execution-graph-set:
      when: state.execution_graph_id != null
    final-commit-recorded:
      when: state.final_commit_sha != null
    review-enabled:
      when: config.review.enabled
    acceptance-passed:
      when: history.last('gate.resolved', node_id='verify.acceptance.gate') != null && history.last('gate.resolved',
        node_id='verify.acceptance.gate').decision == 'pass'
    code-quality-done-or-skipped:
      when: "!config.review.enabled || (history.last('visit.sealed', node_id='verify.code_quality') != null
        && history.last('visit.sealed', node_id='verify.code_quality').outcome in ['completed', 'not_applicable'])"
    code-review-approved:
      when: history.last('gate.resolved', node_id='verify.code_review.gate') != null && history.last('gate.resolved',
        node_id='verify.code_review.gate').decision == 'accept'
    intake-receipt-sealed:
      when: history.count('receipt.linked', visit_id=visit.id, schema='registry:schemas/intake-receipt.schema.json')
        >= 1
    agent-receipt-sealed:
      when: history.count('receipt.linked', visit_id=visit.id, schema='registry:schemas/agent-receipt.schema.json')
        >= 1
    repair-within-limit:
      when: history.count('connection.taken', loop='repair') <= config.limits.repair
    reverify-within-limit:
      when: history.count('visit.sealed', node_id='verify.intake') <= config.limits.reverify
  nodes:
  - id: shape.intake
    kind: step
    title: Shape intake — validate app manifest and capture work request
    produces:
      artifacts:
      - id: ticket
        kind: document
        uri: run:artifacts/{visit_id}/ticket.json
        schema: registry:schemas/ticket.schema.json
        media_type: application/json
    reads:
      config:
      - workspace
      state:
      - app_folder
    allow:
      state:
      - app_folder
      cli:
      - visit.intake.complete
      - visit.state_patch
    receipts:
    - registry:schemas/intake-receipt.schema.json
    - registry:schemas/agent-receipt.schema.json
    lifecycle:
      on_open:
      - check: validate-manifest
      on_seal:
      - check: intake-receipt-sealed
        on_fail:
          action: reopen
          reason: Intake receipt not sealed
      - check: agent-receipt-sealed
        on_fail:
          action: reopen
          reason: Agent receipt not sealed
  - id: shape.examine
    kind: step
    title: Shape examination — draft AC and clarifying questions
    produces:
      artifacts: []
    instructions: registry:nodes/shape.examine/judgment.md
    reads:
      config:
      - foundry.shape
      state:
      - ticket
      - approved_ac
      - clarifying_questions
      - examination_round
      - open_clarifying_questions_count
      - examination_decisions
      - assumptions
      - draft_ac
      artifacts:
      - artifact: shape.intake.ticket
        from: nearest_sealed_ancestor
    allow:
      cli:
      - run.agent.submit
      - visit.examine.complete
    lifecycle:
      on_examine:
      - check: prior-shape-intake-sealed
      on_seal:
      - check: agent-receipt-sealed
        on_fail:
          action: reopen
          reason: Examination not ready to seal
    receipts: registry:schemas/agent-receipt.schema.json
  - id: shape.examine.gate
    kind: gate
    title: Open questions remain — present anyway or continue examination
    instructions: registry:nodes/shape.examine.gate/instructions.md
    reads:
      state:
      - draft_ac
      - clarifying_questions
      - open_clarifying_questions_count
      - assumptions
      - examination_decisions
    produces:
      options:
      - accept
      - reject
    prompt: Examination still has open clarifying questions. Reject to continue questioning, or accept to proceed to
      present the plan with the remaining assumptions visible.
    lifecycle:
      on_examine:
      - check: prior-examine-sealed
    decider: user
    allow:
      user:
        decide: true
  - id: shape.present
    kind: step
    title: Shape present — succinct plan and AC presentation
    produces:
      artifacts:
      - id: presentation
        kind: document
        uri: run:artifacts/{visit_id}/presentation.md
        media_type: text/markdown
    instructions: registry:nodes/shape.present/judgment.md
    reads:
      state:
      - draft_ac
      - assumptions
      - ticket
      - examination_decisions
      - clarifying_questions
      - examination_round
      - approved_ac
    allow:
      cli:
      - run.agent.submit
      - visit.present.complete
    receipts: registry:schemas/agent-receipt.schema.json
    lifecycle:
      on_examine:
      - check: prior-examine-sealed
      on_seal:
      - check: agent-receipt-sealed
        on_fail:
          action: reopen
          reason: Presentation receipt missing
  - id: shape.present.gate
    kind: gate
    title: Plan presentation — refine or record acceptance criteria
    instructions: registry:nodes/shape.present.gate/instructions.md
    reads:
      state:
      - presented_ac
      - presentation_artifact_path
      artifacts:
      - artifact: shape.present.presentation
        from: nearest_sealed_ancestor
    produces:
      options:
      - reject
      - accept
    prompt: Succinct plan presentation shown. Reject to return to examination, or accept to record acceptance criteria.
    lifecycle:
      on_examine:
      - check: prior-present-sealed
    decider: user
    allow:
      user:
        decide: true
  - id: shape.record
    kind: step
    title: Shape record — freeze approved_ac and living plan
    produces:
      artifacts:
      - id: plan
        kind: document
        uri: run:artifacts/{visit_id}/plan.md
        media_type: text/markdown
    instructions: registry:nodes/shape.record/judgment.md
    reads:
      state:
      - presented_ac
      - presentation_artifact_path
      - approved_ac
      artifacts:
      - artifact: shape.present.presentation
        from: nearest_sealed_ancestor
    allow:
      cli:
      - run.agent.submit
      - visit.record.complete
    receipts: registry:schemas/agent-receipt.schema.json
    lifecycle:
      on_examine:
      - check: prior-present-sealed
      on_seal:
      - check: approved-ac-recorded
        on_fail:
          action: reopen
          reason: approved_ac not recorded
      - check: agent-receipt-sealed
        on_fail:
          action: reopen
          reason: Shape record receipt not sealed
  - id: shape.record.gate
    kind: gate
    title: Record acceptance criteria
    instructions: registry:nodes/shape.record.gate/instructions.md
    reads:
      state:
      - approved_ac
      - approved_ac_digest
      - plan_path
      - plan_version
      artifacts:
      - artifact: shape.record.plan
        from: nearest_sealed_ancestor
    produces:
      options:
      - accept
      - hold
    prompt: Living plan and approved_ac are frozen. The user accepts shared understanding of acceptance criteria
      before execute may start, or holds to request changes.
    lifecycle:
      on_examine:
      - check: prior-shape-record-sealed
      - check: approved-ac-recorded
    decider: user
    allow:
      user:
        decide: true
  - id: execute.start
    kind: gate
    title: Start execute phase
    instructions: registry:nodes/execute.start/instructions.md
    reads:
      state:
      - approved_ac
      - plan_path
      artifacts:
      - artifact: shape.record.plan
        from: nearest_sealed_ancestor
    produces:
      options:
      - accept
    prompt: Frozen plan recorded. Run `foundry start` on this run to authorize Execute and advance to execute.intake on your feature branch.
    lifecycle:
      on_examine:
      - check: prior-shape-record-sealed
      - check: approved-ac-recorded
    decider: user
    allow:
      user:
        decide: true
  - id: execute.intake
    kind: step
    title: Execute intake — plan alignment and clean git tree
    produces:
      artifacts: []
    reads:
      config:
      - workspace
      state:
      - approved_ac
      - plan_path
      - intake_path
      - entry_reason
      artifacts:
      - artifact: shape.record.plan
        from: nearest_sealed_ancestor
    allow:
      state:
      - intake_path
      - entry_reason
    receipts:
    - registry:schemas/agent-receipt.schema.json
    - registry:schemas/intake-receipt.schema.json
    lifecycle:
      on_examine:
      - check: approved-ac-recorded
      - check: prior-shape-record-sealed
      on_open:
      - check: validate-manifest
      - check: validate-git-clean-execute
      on_seal:
      - check: intake-receipt-sealed
        on_fail:
          action: reopen
          reason: Execute intake receipt not sealed
      - check: agent-receipt-sealed
        on_fail:
          action: reopen
          reason: Agent receipt not sealed
  - id: execute.intake.gate
    kind: gate
    title: Execute intake blocked check
    instructions: registry:nodes/execute.intake.gate/instructions.md
    reads:
      state:
      - intake_path
    produces:
      options:
      - pass
    prompt: Engine gate. Confirms the sealed execute.intake receipt status is passed before branching.
    lifecycle:
      on_examine:
      - check: prior-execute-intake-sealed
      - check: intake-receipt-sealed
        on_fail:
          action: halt
          reason: Intake receipt failed
    decider: engine
  - id: execute.branch
    kind: step
    title: Create the feature branch
    produces:
      artifacts: []
    reads:
      config:
      - git
      state:
      - run_slug
      - developer_first_name
    allow:
      state:
      - default_branch
      - feature_branch
      - feature_branch_head
      - execution_graph_id
    lifecycle:
      on_examine:
      - check: prior-execute-intake-sealed
  - id: execute.plan
    kind: step
    title: Execution graph and phase-scoped internal brief
    produces:
      artifacts:
      - id: execution-graph
        kind: document
        uri: run:artifacts/{visit_id}/execution-graph.json
        media_type: application/json
      - id: execute-brief
        kind: document
        uri: run:artifacts/{visit_id}/execute-brief.md
        media_type: text/markdown
    instructions: registry:nodes/execute.plan/judgment.md
    reads:
      state:
      - approved_ac
      - approved_ac_digest
      - feature_branch
      - execution_graph_id
      artifacts:
      - artifact: shape.record.plan
        from: nearest_sealed_ancestor
    allow:
      cli:
      - run.agent.submit
      - visit.plan.complete
    receipts: registry:schemas/agent-receipt.schema.json
    context_budget:
      max_input_chars: 16000
      max_summary_chars: 4000
    lifecycle:
      on_examine:
      - check: feature-branch-set
      on_open:
      - check: ensure-execution-graph-reference
      on_seal:
      - check: execution-graph-set
      - check: agent-receipt-sealed
  - id: execute.build
    kind: step
    title: Build graph work items — builders commit via CLI
    produces:
      artifacts: []
    reads:
      config:
      - builders
      - git
      state:
      - execution_graph_id
      - approved_ac
      - feature_branch
      artifacts:
      - artifact: execute.plan.execution-graph
        from: nearest_sealed_ancestor
    allow:
      state:
      - last_build_exit_code
    lifecycle:
      on_examine:
      - check: execution-graph-set
      - check: feature-branch-set
      on_seal:
      - check: validate-build-exit
        on_fail:
          action: reopen
          reason: Build exit validation failed
      - check: agent-receipt-sealed
    receipts: registry:schemas/agent-receipt.schema.json
  - id: execute.test
    kind: step
    title: Run repo verification and repair loop
    produces:
      artifacts: []
    reads:
      config:
      - verification
      state:
      - execution_graph_id
      - feature_branch
      artifacts:
      - artifact: execute.plan.execution-graph
        from: nearest_sealed_ancestor
    allow:
      state:
      - last_test_exit_code
      - repair_loop_count
    lifecycle:
      on_examine:
      - check: prior-execute-build-sealed
      on_seal:
      - check: agent-receipt-sealed
    receipts: registry:schemas/agent-receipt.schema.json
  - id: execute.test.gate
    kind: gate
    title: Execute test pass
    produces:
      options:
      - pass
      - repair
    prompt: Machine gate. Repo verification commands must pass or route to repair.
    lifecycle:
      on_examine:
      - check: prior-execute-test-sealed
    decider: engine
  - id: execute.repair.limit.gate
    kind: gate
    title: Repair loop guard — count prior repair cycles before build
    produces:
      options:
      - proceed
    prompt: Machine gate. All repair routes converge here. Count prior repair loops; escalate when
      config.limits.repair is exceeded so the operator can resume when ready.
    lifecycle:
      on_examine:
      - check: repair-within-limit
        on_fail:
          action: escalate
          reason: Repair loop limit reached
    decider: engine
  - id: execute.commit
    kind: step
    title: Final summarizing commit on feature branch
    produces:
      artifacts:
      - id: final-commit
        kind: reference
        scheme: git_commit
    instructions: registry:steps/execute-commit.md
    reads:
      config:
      - git
      state:
      - execution_graph_id
      - feature_branch
      artifacts:
      - artifact: execute.plan.execution-graph
        from: nearest_sealed_ancestor
    allow:
      state:
      - final_commit_sha
      - execute_commit_message
      cli:
      - artifact.publish
      - transition
    worker:
      prompt: registry:agents/commit-agent.md
      contract: registry:workers/commit-agent/contract.yaml
      mode: execute
    receipts: registry:schemas/agent-receipt.schema.json
    lifecycle:
      on_examine:
      - check: prior-execute-test-sealed
      on_seal:
      - check: final-commit-recorded
        on_fail:
          action: reopen
          reason: Final commit not recorded
      - check: agent-receipt-sealed
  - id: execute.commit.gate
    kind: gate
    title: Execute commit recorded
    produces:
      options:
      - pass
    prompt: Machine gate. Final execute.commit must record a commit on the feature branch (empty commit allowed).
    lifecycle:
      on_examine:
      - check: reverify-within-limit
        on_fail:
          action: escalate
          reason: Re-verify loop limit reached
      - check: prior-execute-commit-sealed
      - check: final-commit-recorded
    decider: engine
  - id: verify.intake
    kind: step
    title: Verify intake — branch diff, receipts, and plan alignment
    produces:
      artifacts:
      - id: branch-diff
        kind: document
        uri: run:artifacts/{visit_id}/branch.diff
        media_type: text/plain
    instructions: registry:steps/verify-intake.md
    reads:
      state:
      - approved_ac
      - plan_path
      - feature_branch
      - default_branch
      - execution_graph_id
      artifacts:
      - artifact: shape.record.plan
        from: nearest_sealed_ancestor
      - artifact: execute.commit.final-commit
        from: nearest_sealed_ancestor
    allow:
      state:
      - verify_diff_scope
      - branch_diff_artifact_path
      files:
        write:
        - run:artifacts/{visit_id}/branch.diff
      cli:
      - artifact.publish
      - transition
    worker:
      prompt: registry:agents/intake-checker.verify.md
      contract: registry:workers/intake-checker.verify/contract.yaml
      mode: verify
    receipts:
    - registry:schemas/agent-receipt.schema.json
    - registry:schemas/intake-receipt.schema.json
    lifecycle:
      on_examine:
      - check: prior-execute-commit-sealed
      - check: feature-branch-set
      - check: final-commit-recorded
      on_open:
      - check: validate-manifest
      - check: validate-verify-context
      on_seal:
      - check: intake-receipt-sealed
        on_fail:
          action: reopen
          reason: Verify intake receipt not sealed
  - id: verify.intake.gate
    kind: gate
    title: Verify intake blocked check
    produces:
      options:
      - pass
    prompt: Machine gate. Intake receipt must exit 0 — CLI checks plus agent assessment when configured.
    lifecycle:
      on_examine:
      - check: prior-verify-intake-sealed
      - check: intake-receipt-sealed
        on_fail:
          action: halt
          reason: Verify intake blocked
    decider: engine
  - id: verify.acceptance
    kind: step
    title: Automated acceptance criteria validation
    produces:
      artifacts:
      - id: verify-findings
        kind: document
        uri: run:artifacts/{visit_id}/verify-findings.json
        media_type: application/json
    instructions: registry:steps/verify-acceptance.md
    reads:
      state:
      - approved_ac
      - execution_graph_id
      - branch_diff_artifact_path
      artifacts:
      - artifact: shape.record.plan
        from: nearest_sealed_ancestor
      - artifact: verify.intake.branch-diff
        from: nearest_sealed_ancestor
    allow:
      state:
      - verify_findings
      cli:
      - artifact.publish
      - transition
      files:
        write:
        - run:artifacts/{visit_id}/verify-findings.json
    worker:
      prompt: registry:agents/implementation-validator.md
      contract: registry:workers/implementation-validator/contract.yaml
      mode: validate
    receipts: registry:schemas/agent-receipt.schema.json
    context_budget:
      max_input_chars: 16000
      max_summary_chars: 4000
    lifecycle:
      on_examine:
      - check: prior-verify-intake-sealed
      on_seal:
      - check: agent-receipt-sealed
  - id: verify.acceptance.gate
    kind: gate
    title: Acceptance result routing
    decider: engine
    produces:
      options:
      - pass
      - replan
      - reshape
      - rework_execute
    prompt: Route the verified acceptance result to quality review, replanning, reshaping, or execution rework.
    lifecycle:
      on_examine:
      - check: prior-verify-acceptance-sealed
  - id: verify.code_quality
    kind: step
    title: Automated lint, Bugbot, and security review
    produces:
      artifacts:
      - id: code-quality-report
        kind: document
        uri: run:artifacts/{visit_id}/code-quality-report.md
        media_type: text/markdown
    instructions: registry:steps/verify-code-quality.md
    reads:
      config:
      - review
      - verification
      state:
      - feature_branch
      - verify_findings
      artifacts:
      - artifact: verify.intake.branch-diff
        from: nearest_sealed_ancestor
    lifecycle:
      on_examine:
      - check: prior-verify-acceptance-sealed
      - check: review-enabled
        on_fail:
          action: skip
          reason: Review disabled in app manifest
      on_seal:
      - check: agent-receipt-sealed
    receipts: registry:schemas/agent-receipt.schema.json
    allow:
      cli:
      - artifact.publish
      - transition
      files:
        write:
        - run:artifacts/{visit_id}/code-quality-report.md
  - id: verify.code_quality.gate
    kind: gate
    title: Code quality result routing
    decider: engine
    produces:
      options:
      - pass
      - repair
    prompt: Route passing code-quality results to human review and failed results to execution repair.
    lifecycle:
      on_examine:
      - check: code-quality-done-or-skipped
  - id: verify.code_review
    kind: step
    title: Human code review — single turn
    produces:
      artifacts:
      - id: verify-notes
        kind: document
        uri: run:artifacts/{visit_id}/verify-notes.md
        media_type: text/markdown
    instructions: registry:steps/verify-code-review.md
    reads:
      state:
      - approved_ac
      - verify_findings
      - branch_diff_artifact_path
      artifacts:
      - artifact: verify.intake.branch-diff
        from: nearest_sealed_ancestor
      - artifact: verify.acceptance.verify-findings
        from: nearest_sealed_ancestor
    allow:
      state:
      - verify_notes
      user:
        ask: true
      cli:
      - artifact.publish
      - transition
      files:
        write:
        - run:artifacts/{visit_id}/verify-notes.md
    lifecycle:
      on_examine:
      - check: acceptance-passed
      - check: code-quality-done-or-skipped
  - id: verify.code_review.gate
    kind: gate
    title: Human code review decision
    instructions: registry:nodes/verify.code_review.gate/instructions.md
    produces:
      options:
      - accept
      - reject
      - reshape
    prompt: Human code review (single turn). Accept verified implementation, reject for repairs (standards), or
      reshape when acceptance criteria are wrong.
    lifecycle:
      on_examine:
      - check: prior-verify-acceptance-sealed
    decider: user
    allow:
      user:
        decide: true
  - id: verify.complete
    kind: step
    title: Verify phase complete
    produces:
      artifacts: []
    instructions: registry:steps/verify-complete.md
    allow:
      state:
      - verified_at
    lifecycle:
      on_examine:
      - check: code-review-approved
  - id: verify.complete.gate
    kind: gate
    title: Verify complete
    instructions: registry:nodes/verify.complete.gate/instructions.md
    produces:
      options:
      - accept
    prompt: User accepts the implementation. Accept to end the verify phase and proceed to deliver.
    decider: user
    allow:
      user:
        decide: true
  - id: deliver.stub
    kind: step
    title: Deliver phase stub (terminal)
    produces:
      artifacts: []
    instructions: registry:steps/deliver-stub.md
    terminal: true
  connections:
  - id: shape.intake-to-shape.examine
    from: shape.intake
    to: shape.examine
    'on':
      outcomes:
      - completed
  - id: shape.examine-to-shape.present
    from: shape.examine
    to: shape.present
    'on':
      outcomes:
      - completed
