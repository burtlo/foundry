# Craft implementation flow — workflow schema v1 (registry format version 2)
#
# Spec:     docs/workflow-schema-v1.md
# Validate: JSON Schema factory-flow.schema.json (foundry.py v1 engine not yet wired)
#
# Omission rule: omit fields that match defaults (see workflow-schema-v1.md § Authoring defaults).
# Implicit writes: state.steps.<node_id>.* — do not list under allow.state.

version: 2
state_schema: schemas/factory-run-state.schema.json

expression:
  namespaces: [config, state, visit, history, decision]
  operators: ["!", "&&", "||", "==", "!=", "<", "<=", ">", ">=", "in", "(", ")"]

flow:
  id: implementation
  entry: shape.intake
  checks:
    validate-manifest:
      command: validate_manifest
    validate-git-clean-execute:
      command: validate_git_clean_execute
    validate-verify-context:
      command: validate_verify_context
    ensure-execution-graph-reference:
      command: ensure_execution_graph_reference
    validate-build-exit:
      command: validate_build_exit
    prior-shape-intake-sealed:
      when: history.last(visit.sealed, node_id='shape.intake').outcome == 'completed'
    prior-examine-sealed:
      when: history.last(visit.sealed, node_id='shape.examine').outcome == 'completed'
    prior-present-sealed:
      when: history.last(visit.sealed, node_id='shape.present').outcome == 'completed'
    prior-shape-record-sealed:
      when: history.last(visit.sealed, node_id='shape.record').outcome == 'completed'
    prior-execute-intake-sealed:
      when: history.last(visit.sealed, node_id='execute.intake').outcome == 'completed'
    prior-execute-commit-sealed:
      when: history.last(visit.sealed, node_id='execute.commit').outcome == 'completed'
    prior-verify-intake-sealed:
      when: history.last(visit.sealed, node_id='verify.intake').outcome == 'completed'
    prior-verify-acceptance-sealed:
      when: history.last(visit.sealed, node_id='verify.acceptance').outcome == 'completed'
    prior-execute-build-sealed:
      when: history.last(visit.sealed, node_id='execute.build').outcome == 'completed'
    prior-execute-test-sealed:
      when: history.last(visit.sealed, node_id='execute.test').outcome == 'completed'
    approved-ac-recorded:
      when: state.approved_ac_version >= 1
    feature-branch-set:
      when: state.feature_branch != null
    execution-graph-set:
      when: state.execution_graph_id != null
    final-commit-recorded:
      when: state.final_commit_sha != null
    review-enabled:
      when: config.review.enabled
    acceptance-passed:
      when: history.last(visit.sealed, node_id='verify.acceptance').outcome == 'completed' && visit.decision == 'pass'
    code-quality-done-or-skipped:
      when: "!config.review.enabled || history.last(visit.sealed, node_id='verify.code_quality').outcome in ['completed', 'not_applicable']"
    code-review-approved:
      when: history.last(visit.sealed, node_id='verify.code_review').outcome == 'completed' && visit.decision == 'approve'
    decision-recorded:
      when: visit.decision != null
    intake-receipt-sealed:
      when: history.last(receipt.linked, node_id=visit.node_id, schema='intake-receipt') != null
    agent-receipt-sealed:
      when: visit.receipt_id != null
  nodes:
  - id: shape.intake
    kind: step
    title: Shape intake — validates inputs, prerequisites, and configuration
    produces:
      type: artifact
      artifacts:
      - ticket
      - intake-receipt
    instructions: registry:steps/shape-intake.md
    reads:
      config:
      - workspace
      state:
      - ticket
      - app_folder
    allow:
      state:
      - ticket
      - run_slug
      - clarifying_questions
      - questions_asked_total
      - examination_round
      - open_clarifying_questions_count
      files:
        write:
        - run:ticket.json
        - run:receipts/
    lifecycle:
      open:
        checks:
        - id: validate-manifest
      seal:
        checks:
        - id: intake-receipt-sealed
          onFail:
            actions:
            - action: reopen
              reason: Intake receipt not sealed
    worker:
      prompt: registry:agents/intake-checker.md
      contract: registry:contracts/intake-checker.yaml
      mode: shape
    receipts:
    - registry:schemas/agent-receipt.schema.json
    - registry:schemas/intake-receipt.schema.json
  - id: shape.examine
    kind: step
    title: Shape examination — conversational integrity questions
    produces:
      type: artifact
      artifacts:
      - examination-decisions
      - clarifying-questions
    instructions: registry:steps/shape-examine.md
    reads:
      config:
      - foundry.shape
      state:
      - ticket
      - approved_ac
      - clarifying_questions
      - questions_asked_total
      - examination_round
      - open_clarifying_questions_count
      - examination_decisions
    allow:
      state:
      - draft_ac
      - assumptions
      - examination_decisions
      - clarifying_questions
      - questions_asked_total
      - examination_round
      - open_clarifying_questions_count
      user:
        ask: true
    lifecycle:
      examine:
        checks:
        - id: prior-shape-intake-sealed
      seal:
        checks:
        - id: agent-receipt-sealed
          onFail:
            actions:
            - action: reopen
              reason: Examination not ready to seal
  - id: shape.examine.gate
    kind: gate
    title: Examination ready — present plan or continue questioning
    produces:
      type: decision
      options:
      - present
      - continue
    prompt: Examination complete — no open clarifying questions. Present the plan or continue questioning.
    lifecycle:
      examine:
        checks:
        - id: prior-examine-sealed
      seal:
        checks:
        - id: decision-recorded
          onFail:
            actions:
            - action: reopen
              reason: Gate decision not recorded
    outcomes:
      present: shape.present
      continue: shape.examine
  - id: shape.present
    kind: step
    title: Shape present — succinct plan and AC presentation
    produces:
      type: artifact
      artifacts:
      - presented-ac
      - presentation
    instructions: registry:steps/shape-present.md
    reads:
      state:
      - draft_ac
      - assumptions
      - examination_decisions
      - clarifying_questions
      - questions_asked_total
      - examination_round
    allow:
      state:
      - presented_ac
      - presentation_artifact_path
    lifecycle:
      examine:
        checks:
        - id: prior-examine-sealed
      seal:
        checks:
        - id: agent-receipt-sealed
          onFail:
            actions:
            - action: reopen
              reason: Presentation receipt missing
    worker:
      prompt: registry:agents/shape-presenter.md
      contract: registry:contracts/shape-presenter.yaml
      mode: shape
    receipts: registry:schemas/agent-receipt.schema.json
  - id: shape.present.gate
    kind: gate
    title: Plan presentation — refine or record acceptance criteria
    produces:
      type: decision
      options:
      - refine
      - record
    prompt: Succinct plan presentation shown. Continue examination, or proceed to record acceptance criteria.
    lifecycle:
      examine:
        checks:
        - id: prior-present-sealed
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      refine: shape.examine
      record: shape.record
  - id: shape.record
    kind: step
    title: Shape record — freeze approved_ac and living plan
    produces:
      type: artifact
      artifacts:
      - approved-ac
      - plan
    instructions: registry:steps/shape-record.md
    reads:
      state:
      - presented_ac
      - presentation_artifact_path
    allow:
      state:
      - approved_ac
      - approved_ac_version
      - approved_ac_digest
      - plan_path
      - plan_version
      - shape_history
      files:
        write:
        - workspace:plan.md
    lifecycle:
      examine:
        checks:
        - id: prior-present-sealed
      seal:
        checks:
        - id: approved-ac-recorded
          onFail:
            actions:
            - action: reopen
              reason: approved_ac not recorded
        - id: agent-receipt-sealed
    worker:
      prompt: registry:agents/shape-recorder.md
      contract: registry:contracts/shape-recorder.yaml
      mode: shape
    receipts: registry:schemas/agent-receipt.schema.json
  - id: shape.record.gate
    kind: gate
    title: Record acceptance criteria
    produces:
      type: decision
      options:
      - record
    prompt: Record the living plan and approved_ac. The user confirms shared understanding of acceptance criteria before execute
      may start.
    lifecycle:
      examine:
        checks:
        - id: prior-shape-record-sealed
        - id: approved-ac-recorded
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      record: execute.start
  - id: execute.start
    kind: gate
    title: Start execute phase
    produces:
      type: decision
      options:
      - start
    prompt: Frozen plan recorded. Invoke /craft-execute in a new chat to begin implementation on a feature branch.
    lifecycle:
      examine:
        checks:
        - id: approved-ac-recorded
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      start: execute.intake
  - id: execute.intake
    kind: step
    title: Execute intake — plan alignment and clean git tree
    produces:
      type: artifact
      artifacts:
      - intake-receipt
    instructions: registry:steps/execute-intake.md
    reads:
      config:
      - workspace
      state:
      - approved_ac
      - plan_path
      - intake_path
      - entry_reason
    allow:
      state:
      - intake_path
      - entry_reason
      files:
        write:
        - run:receipts/
    lifecycle:
      examine:
        checks:
        - id: approved-ac-recorded
        - id: prior-shape-record-sealed
      open:
        checks:
        - id: validate-manifest
        - id: validate-git-clean-execute
      seal:
        checks:
        - id: intake-receipt-sealed
          onFail:
            actions:
            - action: reopen
              reason: Execute intake receipt not sealed
    worker:
      prompt: registry:agents/intake-checker.md
      contract: registry:contracts/intake-checker.yaml
      mode: execute
    receipts:
    - registry:schemas/agent-receipt.schema.json
    - registry:schemas/intake-receipt.schema.json
  - id: execute.intake.gate
    kind: gate
    title: Execute intake blocked check
    produces:
      type: decision
      options:
      - pass
    prompt: Machine gate. Intake receipt must exit 0 — CLI checks plus agent assessment when configured.
    lifecycle:
      examine:
        checks:
        - id: prior-execute-intake-sealed
        - id: intake-receipt-sealed
          onFail:
            actions:
            - action: halt
              reason: Intake receipt failed
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      pass: execute.branch
  - id: execute.branch
    kind: step
    title: Create the feature branch
    produces:
      type: artifact
      artifacts:
      - feature-branch
    instructions: registry:steps/execute-branch.md
    reads:
      config:
      - git
      state:
      - run_slug
      - developer_first_name
    allow:
      state:
      - default_branch
      - feature_branch
      - feature_branch_head
    lifecycle:
      examine:
        checks:
        - id: prior-execute-intake-sealed
  - id: execute.plan
    kind: step
    title: Execution graph and phase-scoped internal brief
    produces:
      type: artifact
      artifacts:
      - execution-graph
      - execute-brief
    instructions: registry:steps/execute-plan.md
    reads:
      state:
      - approved_ac
      - approved_ac_digest
      - feature_branch
    allow:
      state:
      - execution_graph_id
      - execute_brief_path
      files:
        write:
        - run:execution-graph.json
    lifecycle:
      examine:
        checks:
        - id: feature-branch-set
      open:
        checks:
        - id: ensure-execution-graph-reference
      seal:
        checks:
        - id: execution-graph-set
        - id: agent-receipt-sealed
    worker:
      prompt: registry:agents/planner.md
      contract: registry:contracts/planner.yaml
      mode: plan
    receipts: registry:schemas/agent-receipt.schema.json
    context_budget:
      max_input_chars: 16000
      max_summary_chars: 4000
  - id: execute.build
    kind: step
    title: Build graph work items — builders commit via CLI
    produces:
      type: artifact
      artifacts:
      - build-receipts
    instructions: registry:steps/execute-build.md
    reads:
      config:
      - builders
      - git
      state:
      - execution_graph_id
      - approved_ac
      - feature_branch
    allow:
      files:
        write:
        - 'workspace:'
    lifecycle:
      examine:
        checks:
        - id: execution-graph-set
        - id: feature-branch-set
      close:
        checks:
        - id: validate-build-exit
          onFail:
            actions:
            - action: reopen
              reason: Build exit validation failed
      seal:
        checks:
        - id: agent-receipt-sealed
    context_budget:
      max_input_chars: 20000
      max_summary_chars: 4000
  - id: execute.test
    kind: step
    title: Run repo verification and repair loop
    produces:
      type: artifact
      artifacts:
      - test-receipt
    instructions: registry:steps/execute-test.md
    reads:
      config:
      - verification
      state:
      - execution_graph_id
      - feature_branch
    lifecycle:
      examine:
        checks:
        - id: prior-execute-build-sealed
      seal:
        checks:
        - id: agent-receipt-sealed
    worker:
      prompt: registry:agents/repairer.md
      contract: registry:contracts/repairer.yaml
      mode: repair
    receipts: registry:schemas/agent-receipt.schema.json
  - id: execute.test.gate
    kind: gate
    title: Execute test pass
    produces:
      type: decision
      options:
      - pass
      - repair
    prompt: Machine gate. Repo verification commands must pass or route to repair.
    lifecycle:
      examine:
        checks:
        - id: prior-execute-test-sealed
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      pass: execute.commit
      repair: execute.build
  - id: execute.commit
    kind: step
    title: Final summarizing commit on feature branch
    produces:
      type: artifact
      artifacts:
      - final-commit
    instructions: registry:steps/execute-commit.md
    reads:
      config:
      - git
      state:
      - execution_graph_id
      - feature_branch
    allow:
      state:
      - final_commit_sha
      - execute_commit_message
    lifecycle:
      examine:
        checks:
        - id: prior-execute-test-sealed
      seal:
        checks:
        - id: final-commit-recorded
          onFail:
            actions:
            - action: reopen
              reason: Final commit not recorded
        - id: agent-receipt-sealed
    worker:
      prompt: registry:agents/commit-agent.md
      contract: registry:contracts/commit-agent.yaml
      mode: execute
    receipts: registry:schemas/agent-receipt.schema.json
  - id: execute.commit.gate
    kind: gate
    title: Execute commit recorded
    produces:
      type: decision
      options:
      - pass
    prompt: Machine gate. Final execute.commit must record a commit on the feature branch (empty commit allowed).
    lifecycle:
      examine:
        checks:
        - id: prior-execute-commit-sealed
        - id: final-commit-recorded
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      pass: verify.intake
  - id: verify.intake
    kind: step
    title: Verify intake — branch diff, receipts, and plan alignment
    produces:
      type: artifact
      artifacts:
      - verify-intake-receipt
      - branch-diff
    instructions: registry:steps/verify-intake.md
    reads:
      state:
      - approved_ac
      - plan_path
      - feature_branch
      - default_branch
      - execution_graph_id
    allow:
      state:
      - verify_diff_scope
      - branch_diff_artifact_path
      files:
        write:
        - run:receipts/
    lifecycle:
      examine:
        checks:
        - id: prior-execute-commit-sealed
        - id: feature-branch-set
        - id: final-commit-recorded
      open:
        checks:
        - id: validate-manifest
        - id: validate-verify-context
      seal:
        checks:
        - id: intake-receipt-sealed
    worker:
      prompt: registry:agents/intake-checker.md
      contract: registry:contracts/intake-checker.yaml
      mode: verify
    receipts:
    - registry:schemas/agent-receipt.schema.json
    - registry:schemas/intake-receipt.schema.json
  - id: verify.intake.gate
    kind: gate
    title: Verify intake blocked check
    produces:
      type: decision
      options:
      - pass
    prompt: Machine gate. Intake receipt must exit 0 — CLI checks plus agent assessment when configured.
    lifecycle:
      examine:
        checks:
        - id: prior-verify-intake-sealed
        - id: intake-receipt-sealed
          onFail:
            actions:
            - action: halt
              reason: Verify intake blocked
    outcomes:
      pass: verify.acceptance
  - id: verify.acceptance
    kind: step
    title: Automated acceptance criteria validation
    produces:
      type: artifact
      artifacts:
      - verify-findings
    instructions: registry:steps/verify-acceptance.md
    reads:
      state:
      - approved_ac
      - execution_graph_id
      - branch_diff_artifact_path
    allow:
      state:
      - verify_findings
    lifecycle:
      examine:
        checks:
        - id: prior-verify-intake-sealed
      seal:
        checks:
        - id: agent-receipt-sealed
        - id: decision-recorded
    worker:
      prompt: registry:agents/implementation-validator.md
      contract: registry:contracts/implementation-validator.yaml
      mode: validate
    receipts: registry:schemas/agent-receipt.schema.json
    context_budget:
      max_input_chars: 16000
      max_summary_chars: 4000
  - id: verify.code_quality
    kind: step
    title: Automated lint, Bugbot, and security review
    produces:
      type: artifact
      artifacts:
      - code-quality-report
    instructions: registry:steps/verify-code-quality.md
    reads:
      config:
      - review
      - verification
      state:
      - feature_branch
      - verify_findings
    lifecycle:
      examine:
        checks:
        - id: prior-verify-acceptance-sealed
        - id: review-enabled
          onFail:
            actions:
            - action: skip
              reason: Review disabled in app manifest
      seal:
        checks:
        - id: agent-receipt-sealed
  - id: verify.code_review
    kind: step
    title: Human code review — single turn
    produces:
      type: artifact
      artifacts:
      - verify-notes
    instructions: registry:steps/verify-code-review.md
    reads:
      state:
      - approved_ac
      - verify_findings
      - branch_diff_artifact_path
    allow:
      state:
      - verify_notes
      user:
        ask: true
    lifecycle:
      examine:
        checks:
        - id: acceptance-passed
        - id: code-quality-done-or-skipped
      seal:
        checks:
        - id: agent-receipt-sealed
  - id: verify.code_review.gate
    kind: gate
    title: Human code review decision
    produces:
      type: decision
      options:
      - approve
      - reshape
      - repair
    prompt: Human code review (single turn). Approve verified implementation, request reshape (AC wrong), or request repairs
      (standards).
    lifecycle:
      examine:
        checks:
        - id: prior-verify-acceptance-sealed
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      approve: verify.complete
      reshape: shape.intake
      repair: execute.build
  - id: verify.complete
    kind: step
    title: Verify phase complete
    produces:
      type: artifact
      artifacts:
      - verified-at
    instructions: registry:steps/verify-complete.md
    allow:
      state:
      - verified_at
    lifecycle:
      examine:
        checks:
        - id: code-review-approved
  - id: verify.complete.gate
    kind: gate
    title: Verify complete
    produces:
      type: decision
      options:
      - complete
    prompt: User accepts the implementation. Invoke verify.complete to end the verify phase.
    lifecycle:
      seal:
        checks:
        - id: decision-recorded
    outcomes:
      complete: deliver.stub
  - id: deliver.stub
    kind: step
    title: Deliver phase stub (terminal)
    produces:
      type: artifact
    instructions: registry:steps/deliver-stub.md
    terminal: true
  edges:
  - from: shape.intake
    to: shape.examine
    when: always
    priority: 10
  - from: shape.examine
    to: shape.present
    when: state.open_clarifying_questions_count == 0
    priority: 15
  - from: shape.examine
    to: shape.examine.gate
    when: always
    priority: 20
  - from: shape.present
    to: shape.present.gate
    when: always
    priority: 10
  - from: shape.record
    to: shape.record.gate
    when: always
    priority: 10
  - from: execute.intake
    to: execute.intake.gate
    when: always
    priority: 10
  - from: execute.branch
    to: execute.plan
    when: always
    priority: 10
  - from: execute.plan
    to: execute.build
    when: always
    priority: 10
  - from: execute.build
    to: execute.test
    when: always
    priority: 10
  - from: execute.test
    to: execute.test.gate
    when: always
    priority: 10
  - from: execute.commit
    to: execute.commit.gate
    when: always
    priority: 10
  - from: verify.intake
    to: verify.intake.gate
    when: always
    priority: 10
  - from: verify.acceptance
    to: verify.code_quality
    when: decision == 'pass'
    priority: 20
  - from: verify.acceptance
    to: execute.plan
    when: decision == 'replan'
    priority: 25
  - from: verify.acceptance
    to: shape.intake
    when: decision == 'reshape'
    priority: 30
  - from: verify.acceptance
    to: execute.intake
    when: decision == 'rework_execute'
    priority: 22
  - from: verify.code_quality
    to: verify.code_review
    when: always
    priority: 10
  - from: verify.code_review
    to: verify.code_review.gate
    when: always
    priority: 10
  - from: verify.complete
    to: verify.complete.gate
    when: always
    priority: 10
