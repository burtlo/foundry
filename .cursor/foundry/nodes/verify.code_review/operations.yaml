# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/verify_step_executor.py (run_verify_code_review_complete).

version: 1
node_id: verify.code_review

policy:
  admission:
    - hook: on_examine
      check: acceptance-passed
      owner: engine
    - hook: on_examine
      check: code-quality-done-or-skipped
      owner: engine
  completion:
    transition:
      - rule: completed_after_publish
        owner: engine
        connection: verify.code_review-to-verify.code_review.gate
  routing:
    on_success:
      connection: verify.code_review-to-verify.code_review.gate
      owner: engine

presentation:
  gate_prompt: null

mechanism:
  - id: deterministic_verify_code_review_complete
    action: visit.verify.code_review.complete
    note: Delegates to deterministic verify code review executor for notes, state patch, and transition.
