# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/execute_step_executor.py (run_execute_build_complete)
# and advance.py (execute_build_boundary park).

version: 1
node_id: execute.build

policy:
  admission:
    - hook: on_examine
      check: execution-graph-set
      owner: engine
    - hook: on_examine
      check: feature-branch-set
      owner: engine
  completion:
    on_seal:
      - check: validate-build-exit
        owner: engine
        on_fail: reopen
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
    transition:
      - rule: build_commands_passing
        owner: engine
        when: agent_receipt.commands all exit_code == 0
  routing:
    on_success:
      connection: execute.build-to-execute.test
      owner: engine

presentation:
  steward_blurb:
    owner: cli
    section: "## Execute build"
    note: render.py engine-owned markdown when flow has no instructions

mechanism:
  - id: execute_build_boundary_park
    action: execute.build.boundary.park
    note: Park once after plan/repair admission; second advance executes build.

  - id: deterministic_build_complete
    action: visit.execute.build.complete
    note: Delegates to deterministic build executor for commands, receipt, and transition.
