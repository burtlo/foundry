# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Steward product: steward-ux + node-instructions (work_prompt, optional app_folder patch).

version: 1
node_id: shape.intake

policy:
  admission:
    - hook: on_open
      check: validate-manifest
      owner: engine
  completion:
    on_close:
      - check: artifact_completeness
        owner: engine
        requires_artifacts:
          - ticket
        when: intake_receipt.status == passed
    on_seal:
      - check: intake-receipt-sealed
        owner: engine
        on_fail: reopen
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
    transition:
      - rule: intake_receipt_not_blocked
        owner: engine
        code: INTAKE_BLOCKED
      - rule: blocked_visit_stays_open
        owner: engine
        when: intake_receipt.status == blocked
        allows: [receipt_seal]
        denies: [artifact_publish, transition]
  routing:
    on_success:
      connection: shape.intake-to-shape.examine
      owner: engine

presentation:
  gate_prompt: null
  blocked_message:
    owner: cli
    template: intake_blocked_summary
    sources:
      - intake_receipt.agent_assessment
      - run:receipts/assessment.md

mechanism:
  - id: deterministic_intake_complete
    action: visit.intake.complete
    note: Delegates to deterministic intake executor for ticket + receipt ledger parity.
