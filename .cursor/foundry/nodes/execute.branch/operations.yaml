# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/execute_step_executor.py (run_execute_branch_complete).

version: 1
node_id: execute.branch

policy:
  admission:
    - hook: on_examine
      check: prior-execute-intake-sealed
      owner: engine
  completion:
    transition:
      - rule: feature_branch_recorded
        owner: engine
  routing:
    on_success:
      connection: execute.branch-to-execute.plan
      owner: engine

presentation:
  steward_blurb:
    owner: cli
    template: execute_branch_engine_owned
    note: See render.py — no judgment or instructions packet sections

mechanism:
  - id: deterministic_branch_complete
    action: visit.execute.branch.complete
    note: Delegates to deterministic branch executor for feature-branch setup.
