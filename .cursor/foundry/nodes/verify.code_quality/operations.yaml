# Author-only narrative for docgen — not bound in factory-flow.yaml.
# Runtime mechanism: foundry_cli/engine/verify_step_executor.py (run_verify_code_quality_complete).

version: 1
node_id: verify.code_quality

policy:
  admission:
    - hook: on_examine
      check: prior-verify-acceptance-sealed
      owner: engine
    - hook: on_examine
      check: review-enabled
      owner: engine
      on_fail:
        action: skip
        reason: Review disabled in app manifest
  completion:
    on_seal:
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
    transition:
      - rule: completed_after_publish
        owner: engine
        connection: verify.code_quality-to-verify.code_quality.gate
      - rule: not_applicable_when_review_disabled
        owner: engine
        connection: verify.code_quality-to-verify.code_review-skipped
  routing:
    on_success:
      connection: verify.code_quality-to-verify.code_quality.gate
      owner: engine

presentation:
  gate_prompt: null

mechanism:
  - id: resolve_commands
    action: host.manifest_or_stub
    owner: engine
    invokes: _commands_for_code_quality
    inputs:
      review: config.review
      verification: config.verification

  - id: host_code_quality_complete
    action: run.advance
    when: visit.lifecycle in [opened, examined]
    owner: engine
    invokes: run_verify_code_quality_complete

  - id: publish_code_quality_report
    action: artifact.publish
    path: run:artifacts/{visit_id}/code-quality-report.md
    owner: engine
    when: review.enabled

  - id: seal_agent_receipt
    action: receipt.seal
    schema: registry:schemas/agent-receipt.schema.json
    agent_name: implementation-validator
    agent_mode: validate
    owner: engine
    when: review.enabled

  - id: transition_complete
    action: visit.transition
    summary: Verify code quality recorded
    owner: engine
