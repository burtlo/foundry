# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/verify_step_executor.py (run_verify_code_quality_complete).

version: 1
node_id: verify.code_quality

policy:
  admission:
    - hook: on_examine
      check: prior-verify-acceptance-sealed
      owner: engine
    - hook: on_examine
      check: review-enabled
      owner: engine
      on_fail:
        action: skip
        reason: Review disabled in app manifest
  completion:
    on_seal:
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
    transition:
      - rule: completed_after_publish
        owner: engine
        connection: verify.code_quality-to-verify.code_quality.gate
      - rule: not_applicable_when_review_disabled
        owner: engine
        connection: verify.code_quality-to-verify.code_review-skipped
  routing:
    on_success:
      connection: verify.code_quality-to-verify.code_quality.gate
      owner: engine

presentation:
  gate_prompt: null

mechanism:
  - id: deterministic_verify_code_quality_complete
    action: visit.verify.code_quality.complete
    note: Delegates to deterministic verify code quality executor for report, receipt, and transition.
