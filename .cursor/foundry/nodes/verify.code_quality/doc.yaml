# Author-only annotations for doc generation (not duplicated from node.yaml).

status: ok
summary: Host-owned deterministic code-quality checks after verify.acceptance.gate
  pass when review is enabled. Runs manifest code_quality or lint commands, publishes
  code-quality-report, seals implementation-validator-labeled agent receipt, routes
  to verify.code_quality.gate; when review is disabled seals not_applicable and skips
  to verify.code_review.
gaps:
- Bugbot and security-review subagents are not invoked on the default host slice
- production apps must define code_quality or lint in app manifest (non-stub)
