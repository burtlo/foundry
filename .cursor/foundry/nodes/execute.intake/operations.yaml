# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/execute_step_executor.py (run_execute_intake_complete).
# Product: host auto-advance on opened visit; steward may call run advance when host is not running.

version: 1
node_id: execute.intake

policy:
  admission:
    - hook: on_examine
      check: approved-ac-recorded
      owner: engine
    - hook: on_examine
      check: prior-shape-record-sealed
      owner: engine
    - hook: on_open
      check: validate-manifest
      owner: engine
    - hook: on_open
      check: validate-git-clean-execute
      owner: engine
  completion:
    on_seal:
      - check: intake-receipt-sealed
        owner: engine
        on_fail: reopen
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
    transition:
      - rule: intake_receipt_not_blocked
        owner: engine
        code: INTAKE_BLOCKED
      - rule: blocked_visit_stays_open
        owner: engine
        when: intake_receipt.status == blocked
        denies: [transition]
  routing:
    on_success:
      connection: execute.intake-to-execute.intake.gate
      owner: engine

presentation:
  gate_prompt: null
  blocked_message:
    owner: cli
    template: intake_blocked_summary
    sources:
      - intake_receipt.agent_assessment
      - run:receipts/assessment.md

mechanism:
  - id: deterministic_intake_complete
    action: visit.intake.complete
    note: Delegates to deterministic execute intake executor for receipt + ledger parity.
