# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/execute_step_executor.py (run_execute_test_complete)
# and advance.py (execute_test_complete on opened visit).

version: 1
node_id: execute.test

policy:
  admission:
    - hook: on_examine
      check: prior-execute-build-sealed
      owner: engine
  completion:
    on_seal:
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
    transition:
      - rule: verification_recorded
        owner: engine
        when: agent_receipt sealed with commands[]
  routing:
    on_success:
      connection: execute.test-to-execute.test.gate
      owner: engine

presentation:
  steward_blurb:
    owner: cli
    section: "## Execute test"
    note: render.py engine-owned markdown when flow has no instructions

mechanism:
  - id: deterministic_test_complete
    action: visit.execute.test.complete
    note: Delegates to deterministic test executor for policy, commands, and transition.
