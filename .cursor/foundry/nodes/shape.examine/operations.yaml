# Author-only narrative for docgen — not bound in node.yaml (flow registry defines routing).
# Runtime mechanism: submit.py, examination_state.py, shape_step_executor.run_shape_examine_complete, advance.py
# Steward product: steward-ux + node-instructions (agent submit, answer, visit examine complete)

version: 1
node_id: shape.examine
note: Mechanism implemented in submit.py, examination_state.py, shape_step_executor.run_shape_examine_complete, advance.py

policy:
  admission:
    - hook: on_examine
      check: prior-shape-intake-sealed
      owner: engine
  completion:
    on_seal:
      - check: agent-receipt-sealed
        owner: engine
        on_fail: reopen
  routing:
    owner: engine
    connections:
      - to: shape.present
        when: "state.open_clarifying_questions_count == 0"
      - to: shape.examine.gate
        when: "state.open_clarifying_questions_count != 0"

presentation:
  gate_prompt: null
  clarifying_flow:
    owner: engine
    via: answer
