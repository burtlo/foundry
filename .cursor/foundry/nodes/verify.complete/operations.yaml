# Author-only narrative for docgen — not bound in node.yaml (flow registry defines routing).
# Runtime mechanism: foundry_cli/engine/verify_step_executor.py (run_verify_complete_complete).

version: 1
node_id: verify.complete

policy:
  admission:
    - hook: on_examine
      check: code-review-approved
      owner: engine
  completion:
    transition:
      - rule: completed_after_verified_at
        owner: engine
        connection: verify.complete-to-verify.complete.gate
  routing:
    on_success:
      connection: verify.complete-to-verify.complete.gate
      owner: engine

presentation:
  gate_prompt: null

mechanism:
  - id: host_verify_complete
    action: run.advance
    when: visit.lifecycle == opened
    owner: engine
    invokes: run_verify_complete_complete

  - id: patch_verified_at
    action: state.patch
    keys:
      - verified_at
    owner: engine

  - id: transition_complete
    action: visit.transition
    summary: Verify phase complete
    owner: engine
