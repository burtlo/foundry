# Flow-bound operations manifest (node.yaml `operations:`). Host advance runs `mechanism:` via MechanismRunner.
# Runtime mechanism: foundry_cli/engine/verify_step_executor.py (run_verify_complete_complete).

version: 1
node_id: verify.complete

policy:
  admission:
    - hook: on_examine
      check: code-review-approved
      owner: engine
  completion:
    transition:
      - rule: completed_after_verified_at
        owner: engine
        connection: verify.complete-to-verify.complete.gate
  routing:
    on_success:
      connection: verify.complete-to-verify.complete.gate
      owner: engine

presentation:
  gate_prompt: null

mechanism:
  - id: deterministic_verify_complete_complete
    action: visit.verify.complete.complete
    note: Delegates to deterministic verify complete executor for state patch and transition.
