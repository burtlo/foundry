node_id: verify.intake
flow_id: implementation
kind: step
title: Verify intake — branch diff, receipts, and plan alignment
entry: false
terminal: false
assets:
  instructions: registry:steps/verify-intake.md
  worker:
    prompt: registry:agents/intake-checker.verify.md
    contract: registry:workers/intake-checker.verify/contract.yaml
    mode: verify
  receipts:
  - registry:schemas/agent-receipt.schema.json
  - registry:schemas/intake-receipt.schema.json
  artifacts:
  - id: branch-diff
    kind: document
    uri: run:artifacts/{visit_id}/branch.diff
    media_type: text/plain
connections:
  in:
  - id: execute.commit.gate-to-verify.intake-pass
    from: execute.commit.gate
    to: verify.intake
    'on':
      outcomes:
      - completed
      decisions:
      - pass
  out:
  - id: verify.intake-to-verify.intake.gate
    from: verify.intake
    to: verify.intake.gate
    'on':
      outcomes:
      - completed
checks_used:
  on_examine:
  - prior-execute-commit-sealed
  - feature-branch-set
  - final-commit-recorded
  on_open:
  - validate-manifest
  - validate-verify-context
  on_close: []
  on_seal:
  - intake-receipt-sealed
tests: []
