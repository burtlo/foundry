node_id: shape.present
flow_id: implementation
kind: step
title: Shape present — succinct plan and AC presentation
entry: false
terminal: false
assets:
  instructions: registry:nodes/shape.present/judgment.md
  receipts:
  - registry:schemas/agent-receipt.schema.json
  artifacts:
  - id: presentation
    kind: document
    uri: run:artifacts/{visit_id}/presentation.md
    media_type: text/markdown
connections:
  in:
  - id: shape.examine-to-shape.present
    from: shape.examine
    to: shape.present
    'on':
      outcomes:
      - completed
    when: state.open_clarifying_questions_count == 0
  - id: shape.examine.gate-to-shape.present-present
    from: shape.examine.gate
    to: shape.present
    'on':
      outcomes:
      - completed
      decisions:
      - accept
  - id: shape.record.gate-to-shape.present-reshape_plan
    from: shape.record.gate
    to: shape.present
    'on':
      outcomes:
      - completed
      decisions:
      - hold
    loop: reshape_plan
  out:
  - id: shape.present-to-shape.present.gate
    from: shape.present
    to: shape.present.gate
    'on':
      outcomes:
      - completed
checks_used:
  on_examine:
  - prior-examine-sealed
  on_open: []
  on_close: []
  on_seal:
  - agent-receipt-sealed
tests:
- .cursor/foundry/cli/tests/acceptance/features/job_host.feature
- .cursor/foundry/cli/tests/acceptance/features/run_context.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_examine.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_examine_gate.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_phase_e2e.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_present.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_present_gate.feature
- .cursor/foundry/cli/tests/acceptance/features/shape_record_gate.feature
- .cursor/foundry/cli/tests/acceptance/features/user_cli.feature
authoring: registry:nodes/shape.present/doc.yaml
