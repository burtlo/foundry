node_id: verify.acceptance
flow_id: implementation
kind: step
title: Automated acceptance criteria validation
entry: false
terminal: false
assets:
  receipts:
  - registry:schemas/agent-receipt.schema.json
  artifacts:
  - id: verify-findings
    kind: document
    uri: run:artifacts/{visit_id}/verify-findings.json
    media_type: application/json
connections:
  in:
  - id: verify.intake.gate-to-verify.acceptance-pass
    from: verify.intake.gate
    to: verify.acceptance
    'on':
      outcomes:
      - completed
      decisions:
      - pass
  out:
  - id: verify.acceptance-to-verify.acceptance.gate
    from: verify.acceptance
    to: verify.acceptance.gate
    'on':
      outcomes:
      - completed
checks_used:
  on_examine:
  - prior-verify-intake-sealed
  on_open: []
  on_close: []
  on_seal:
  - agent-receipt-sealed
tests: []
authoring: registry:nodes/verify.acceptance/doc.yaml
