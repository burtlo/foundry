[pytest]
pythonpath = .
testpaths = tests
bdd_features_base_dir = tests/acceptance/features/
markers =
    node(name): mark acceptance scenario with node id tag
    node.shape.intake: acceptance scenario tagged for shape.intake node
    node.shape.examine: acceptance scenario tagged for shape.examine node
    node.shape.examine.gate: acceptance scenario tagged for shape.examine.gate node
    node.shape.present: acceptance scenario tagged for shape.present node
    node.shape.present.gate: acceptance scenario tagged for shape.present.gate node
    node.shape.record: acceptance scenario tagged for shape.record node
    node.shape.record.gate: acceptance scenario tagged for shape.record.gate node
    node.execute.plan: acceptance scenario tagged for execute.plan node
    node.execute.intake: acceptance scenario tagged for execute.intake node
    node.execute.intake.gate: acceptance scenario tagged for execute.intake.gate node
    node.execute.build: acceptance scenario tagged for execute.build node
    node.execute.branch: acceptance scenario tagged for execute.branch node
    node.execute.test.gate: acceptance scenario tagged for execute.test.gate node
    node.execute.repair.limit.gate: acceptance scenario tagged for execute.repair.limit.gate node
    app.bootstrap: acceptance scenario tagged for app bootstrap
    foundry.config: acceptance scenario for foundry registry config
    foundry.run.archive: acceptance scenario for run archive
    foundry.catalog: acceptance scenario for catalog build
    foundry.doc: acceptance scenario for doc build
    foundry.run.context: acceptance scenario for run context packet
    foundry.shape.e2e: acceptance scenario for shape phase end-to-end
    node.execute.start: acceptance scenario tagged for execute.start node
    node.verify.intake: acceptance scenario tagged for verify.intake node
    cli.user: acceptance scenario for user-facing CLI commands
